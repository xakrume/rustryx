[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/rustryx/rustryx"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
rustryx-core = { path = "crates/rustryx-core" }
rustryx-config = { path = "crates/rustryx-config" }
rustryx-observability = { path = "crates/rustryx-observability" }
rustryx-db = { path = "crates/rustryx-db" }
rustryx-blob = { path = "crates/rustryx-blob" }
rustryx-auth = { path = "crates/rustryx-auth" }
rustryx-rbac = { path = "crates/rustryx-rbac" }
rustryx-format-core = { path = "crates/rustryx-format-core" }
rustryx-format-maven = { path = "crates/rustryx-format-maven" }
rustryx-format-npm = { path = "crates/rustryx-format-npm" }
rustryx-format-pypi = { path = "crates/rustryx-format-pypi" }
rustryx-format-oci = { path = "crates/rustryx-format-oci" }
rustryx-format-helm = { path = "crates/rustryx-format-helm" }
rustryx-format-raw = { path = "crates/rustryx-format-raw" }
rustryx-format-pub = { path = "crates/rustryx-format-pub" }
rustryx-api = { path = "crates/rustryx-api" }
rustryx-tasks = { path = "crates/rustryx-tasks" }
rustryx-testkit = { path = "crates/rustryx-testkit" }
rustryx-testserver = { path = "crates/rustryx-testserver" }

aes-gcm = "0.11"
argon2 = "0.6"
arc-swap = "1"
bcrypt = "0.19"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
moka = { version = "0.12", features = ["future"] }
openidconnect = "4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2", "gzip"] }
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
futures = "0.3"
hex = "0.4"
http = "1"
ipnet = "2"
md-5 = "0.11"
proptest = "1"
regex = "1"
secrecy = { version = "0.10", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "time", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = "1"
ed25519-dalek = { version = "2", features = ["pem"] }
num_cpus = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "macros", "uuid", "time", "json"] }
testcontainers = "0.28"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
axum-core = "0.5"
dashmap = "6"
metrics = "0.24"
wiremock = "0.6"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "matched-path", "original-uri", "query", "tokio", "tracing"] }
clap = { version = "4", features = ["derive", "env"] }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic", "tls-aws-lc", "tls-roots", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
tower = { version = "0.5", default-features = false, features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.7", default-features = false, features = ["catch-panic", "compression-gzip", "cors", "limit", "timeout"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "fmt", "std", "smallvec"] }
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
hmac = "0.13"
include_dir = "0.7"
quick-xml = "0.41"
blake2 = "0.11"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
multer = "3"
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }

[profile.dev]
# No debug info and no incremental cache: a full workspace test build used to leave 42 GB in
# target/ (debug info in every test binary plus the incremental cache) and filled the disk of
# the development machine. Backtraces keep function names, only line tables are gone; build a
# crate with `--config profile.dev.debug=1` when a debugger needs lines.
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
