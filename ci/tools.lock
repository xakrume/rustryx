# Pinned release binaries. GitHub Actions installs the cargo tools, trivy and
# cosign through taiki-e/install-action (its manifest at the pinned commit carries
# their checksums); trivy and cosign are listed here as well for the GitLab
# pipeline, which has no such action. Keep the versions equal to the ones in
# .github/workflows/ci.yml. One line per tool and architecture:
#   <tool> <version> <arch> <sha256> <url> [archive-member]
# ci/install-tool.sh refuses a download whose SHA-256 differs. To upgrade: change
# the version and url, download the file, compute `sha256sum`, compare it with the
# project's published checksum file where one exists (gitleaks and actionlint
# publish one, hadolint does not: its values are trust-on-first-use), commit.
