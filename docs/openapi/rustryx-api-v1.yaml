          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        duration_ms:
          type: [integer, 'null']
          minimum: 0
          format: int64
        summary:
          type: object
          additionalProperties: true
          description: Task specific result counters (never secrets).
        error_code:
          type: [string, 'null']
        log_available:
          type: boolean
        log_expires_at:
