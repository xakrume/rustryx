              value:
                error:
                  code: invalid_page_token
                  message: The page token is not valid for this request
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    Unauthorized:
      description: No or invalid credentials (`unauthenticated`, `invalid_credentials`, `invalid_token`, `token_expired`,
        `token_revoked`). A `WWW-Authenticate` challenge is sent.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            unauthenticated:
              summary: unauthenticated
              value:
                error:
                  code: unauthenticated
                  message: Authentication is required
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
            token_expired:
              summary: token_expired
              value:
                error:
                  code: token_expired
                  message: The token has expired
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    Forbidden:
      description: Authenticated but not allowed (`forbidden`), or the CSRF check failed (`csrf_rejected`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            forbidden:
              summary: forbidden
              value:
                error:
                  code: forbidden
                  message: Access denied
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
            csrf_rejected:
              summary: csrf_rejected
              value:
                error:
                  code: csrf_rejected
                  message: The CSRF token is missing or does not match
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    NotFound:
      description: The addressed object does not exist or is hidden from the caller (`<entity>_not_found`, `not_found`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            repository_not_found:
              summary: repository_not_found
              value:
                error:
                  code: repository_not_found
                  message: Repository not found
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    Conflict:
      description: The request conflicts with the current state (`already_exists`, `conflict`, `resource_in_use` and the
        other 409 codes). Nothing was changed.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            already_exists:
              summary: already_exists
              value:
                error:
                  code: already_exists
                  message: A repository with this name already exists
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
            resource_in_use:
              summary: resource_in_use
              value:
                error:
                  code: resource_in_use
                  message: The routing rule is assigned to repositories
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
                  details:
                    dependents:
                    - kind: repository
                      id: 0192f6c4-5a1e-7000-8000-000000000015
                      name: npm-proxy
    PreconditionFailed:
      description: '`If-Match` does not match the current version (`precondition_failed`). Reload the object and merge.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            precondition_failed:
              summary: precondition_failed
              value:
                error:
                  code: precondition_failed
                  message: The object was changed by someone else
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    PreconditionRequired:
      description: The endpoint needs an `If-Match` header (`precondition_required`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            precondition_required:
              summary: precondition_required
              value:
                error:
                  code: precondition_required
                  message: Send If-Match with the ETag of the version you edited
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    PayloadTooLarge:
      description: The body exceeds the route limit (`payload_too_large`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            payload_too_large:
              summary: payload_too_large
              value:
                error:
                  code: payload_too_large
                  message: The request body is too large
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    UnsupportedMediaType:
      description: The content type is not accepted (`unsupported_media_type`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            unsupported_media_type:
              summary: unsupported_media_type
              value:
                error:
                  code: unsupported_media_type
                  message: 'The request must have Content-Type: application/json'
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    TooManyRequests:
      description: Rate limit or login lockout (`rate_limited`, `locked_out`). Wait `Retry-After` seconds.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
        Retry-After: {$ref: '#/components/headers/RetryAfterHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            rate_limited:
              summary: rate_limited
              value:
                error:
                  code: rate_limited
                  message: Too many requests, slow down
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    InternalError:
      description: Unexpected failure (`internal_error`). Quote the `request_id`.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            internal_error:
              summary: internal_error
              value:
                error:
                  code: internal_error
                  message: Internal server error
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    ServiceUnavailable:
      description: The node or a dependency is unavailable (`overloaded`, `store_unavailable`, `blob_store_unavailable`,
        `identity_provider_unavailable`, `read_only_mode`, ...). Retry after `Retry-After` seconds.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
        Retry-After: {$ref: '#/components/headers/RetryAfterHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            overloaded:
              summary: overloaded
              value:
                error:
                  code: overloaded
                  message: The service is overloaded, retry later
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
            store_unavailable:
              summary: store_unavailable
              value:
                error:
                  code: store_unavailable
                  message: A required service is temporarily unavailable
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    InsufficientStorage:
      description: A quota would be exceeded (`quota_exceeded`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            quota_exceeded:
              summary: quota_exceeded
              value:
                error:
                  code: quota_exceeded
                  message: The storage quota would be exceeded
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
                  details:
                    limit_bytes: 10737418240
                    used_bytes: 10700000000
  schemas:
    FieldError:
      type: object
      description: One field level validation problem.
      properties:
        field:
          type: string
          description: JSON pointer to the offending field in the request body (`/proxy/remote_url`), or the query parameter
            name.
          example: /proxy/remote_url
        code:
          type: string
          description: Stable machine code of the violated rule.
          example: url_not_allowed
        message:
          type: string
          description: Human readable text, safe to show.
          example: The host resolves to a private address.
      required: [field, code, message]
      example:
        field: /proxy/remote_url
        code: url_not_allowed
        message: The host resolves to a private address.
    Dependent:
      type: object
      description: An object that blocks a change, listed in `details.dependents` of a `resource_in_use` error.
      properties:
        kind:
          type: string
          description: Entity kind, for example `repository`, `role`, `privilege`.
          example: repository
        id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
          example: maven-public
      required: [kind, name]
      example:
        kind: repository
        id: 0192f6c4-5a1e-7000-8000-000000000015
        name: npm-proxy
    SelectorCompileIssue:
      type: object
      description: One compile error of a content selector expression.
      properties:
        kind:
          type: string
          enum: [empty, too_long, too_deep, syntax, type, regex]
          description: Class of the compile error (the variants of the selector engine).
        message:
          type: string
          example: 'syntax error: unexpected token '')'''
        offset:
          type: [integer, 'null']
          minimum: 0
          description: Byte offset in the expression, when the error has a position.
          format: int64
      required: [kind, message, offset]
      example:
        kind: syntax
        message: 'syntax error: unexpected token '')'''
        offset: 12
    ErrorDetails:
      type: object
      description: 'Optional structured detail. Additive extension of the envelope: clients ignore keys they do not know.
        Never contains secrets, SQL, paths or upstream addresses.'
      properties:
        fields:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
          description: Present on `invalid_input`, `immutable_field`, `invalid_pattern`.
        dependents:
          type: array
          items: {$ref: '#/components/schemas/Dependent'}
          description: Present on `resource_in_use`.
        compile_errors:
          type: array
          items: {$ref: '#/components/schemas/SelectorCompileIssue'}
          description: Present on `invalid_selector`.
        policy:
          type: string
          description: Write policy that refused a write (`write_policy_violation`).
        rule:
          type: string
          description: Name of the SSRF rule or immutability rule behind the refusal.
        min_prefix:
          type: integer
          description: Minimum search prefix (`query_too_short`).
          format: int64
        max_days:
          type: integer
          description: Maximum range in days (`range_too_large`).
          format: int64
        component_count:
          type: integer
          description: Components still in the repository (`repository_not_empty`).
          format: int64
        limit_bytes:
          type: integer
          description: Quota limit (`quota_exceeded`).
          format: int64
        used_bytes:
          type: integer
          description: Quota usage (`quota_exceeded`).
          format: int64
      additionalProperties: true
      example:
        dependents:
        - kind: repository
          id: 0192f6c4-5a1e-7000-8000-000000000015
          name: npm-proxy
    ErrorBody:
      type: object
      description: The error object.
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Stable public code. Clients switch on it, never on `message`. The catalogue is in docs/api-conventions.md;
            new codes may appear, so treat unknown ones by status class.
        message:
          type: string
          description: Written per code, safe to show, at most 240 characters. Never repeats backend error text.
        request_id:
          type: string
          description: Value of the `X-Request-Id` response header. Absent only when no id could be assigned.
        details: {$ref: '#/components/schemas/ErrorDetails'}
      required: [code, message]
      x-known-codes:
      - code: invalid_input
        status: 400
      - code: invalid_json
        status: 400
      - code: invalid_query
        status: 400
      - code: invalid_path
        status: 400
      - code: invalid_body
        status: 400
      - code: invalid_page_token
        status: 400
      - code: unsupported_sort
        status: 400
      - code: query_too_short
        status: 400
      - code: range_too_large
        status: 400
      - code: immutable_field
        status: 400
      - code: invalid_selector
        status: 400
      - code: invalid_pattern
        status: 400
      - code: upstream_url_rejected
        status: 400
      - code: digest_mismatch
        status: 400
      - code: oidc_callback_invalid
        status: 400
      - code: unauthenticated
        status: 401
      - code: invalid_credentials
        status: 401
      - code: invalid_token
        status: 401
      - code: token_expired
        status: 401
      - code: token_revoked
        status: 401
      - code: forbidden
        status: 403
      - code: csrf_rejected
        status: 403
      - code: not_found
        status: 404
      - code: route_not_found
        status: 404
      - code: repository_not_found
        status: 404
      - code: blob_store_not_found
        status: 404
      - code: component_not_found
        status: 404
      - code: asset_not_found
        status: 404
      - code: user_not_found
        status: 404
      - code: role_not_found
        status: 404
      - code: privilege_not_found
        status: 404
      - code: content_selector_not_found
        status: 404
      - code: idp_group_mapping_not_found
        status: 404
      - code: api_token_not_found
        status: 404
      - code: cleanup_policy_not_found
        status: 404
      - code: routing_rule_not_found
        status: 404
      - code: lifecycle_run_not_found
        status: 404
      - code: task_not_found
        status: 404
      - code: task_run_not_found
        status: 404
      - code: audit_event_not_found
        status: 404
      - code: format_not_found
        status: 404
      - code: blob_not_found
        status: 404
      - code: <entity>_not_found
        status: 404
      - code: method_not_allowed
        status: 405
      - code: request_body_timeout
        status: 408
      - code: payload_too_large
        status: 413
      - code: unsupported_media_type
        status: 415
      - code: range_not_satisfiable
        status: 416
      - code: already_exists
        status: 409
      - code: conflict
        status: 409
      - code: username_conflict
        status: 409
      - code: resource_in_use
        status: 409
      - code: builtin_read_only
        status: 409
      - code: role_cycle
        status: 409
      - code: cannot_modify_self
        status: 409
      - code: last_admin
        status: 409
      - code: external_identity
        status: 409
      - code: repository_not_hosted
        status: 409
      - code: repository_not_empty
        status: 409
      - code: write_policy_violation
        status: 409
      - code: unsupported_for_format
        status: 409
      - code: setting_managed_by_config
        status: 409
      - code: idempotency_conflict
        status: 409
      - code: run_in_progress
        status: 409
      - code: immutable_tag
        status: 409
      - code: not_ready
        status: 409
      - code: precondition_failed
        status: 412
      - code: precondition_required
        status: 428
      - code: rate_limited
        status: 429
      - code: locked_out
        status: 429
      - code: internal_error
        status: 500
      - code: upstream_error
        status: 502
      - code: overloaded
        status: 503
      - code: store_unavailable
        status: 503
      - code: blob_store_unavailable
        status: 503
      - code: dependency_unavailable
        status: 503
      - code: identity_provider_unavailable
        status: 503
      - code: login_unavailable
        status: 503
      - code: authentication_unavailable
        status: 503
      - code: authorization_unavailable
        status: 503
      - code: read_only_mode
        status: 503
      - code: request_timeout
        status: 504
      - code: upstream_timeout
        status: 504
      - code: quota_exceeded
        status: 507
      example:
        code: repository_not_found
        message: Repository not found
        request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    Error:
      type: object
      description: The envelope of every error response of the native API, as implemented in rustryx-api (`{error:{code,message,request_id}}`)
        plus the optional `details` extension.
      properties:
        error: {$ref: '#/components/schemas/ErrorBody'}
      required: [error]
      example:
        error:
          code: repository_not_found
          message: Repository not found
          request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
    RepoName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      description: 'URL safe repository name (rustryx-core `RepoName`): starts with a letter or digit, then letters, digits,
        `.`, `_`, `-`; no `..`, must not end with `.`.'
      example: maven-releases
    RepoFormat:
      type: string
      enum: [maven2, npm, pypi, docker, oci, helm, raw, pub, rpm, apt, apk]
      description: Package format of a repository (rustryx-core `RepoFormat`, lowercase label). More formats arrive additively;
        clients must tolerate unknown values.
      example: maven2
    RepoType:
      type: string
      enum: [hosted, proxy, group]
      description: How a repository obtains its content (rustryx-core `RepoType`).
      example: hosted
    WritePolicy:
      type: string
      enum: [allow, allow_once, deny]
      description: 'What a hosted repository does with a second upload to an existing path (rustryx-core `WritePolicy`):
        overwrite, refuse with 409, or read only.'
      example: allow_once
    BlobStoreKind:
      type: string
      enum: [local, s3]
      description: Kind of a blob store (rustryx-core `BlobStoreKind`). `azure` and `group` arrive with UI-M2.
      example: local
    Action:
      type: string
      enum: [browse, read, write, delete]
      description: An action on content (rustryx-core `Action`). `browse` is UI and search, `read` is client download.
      example: read
    UserSource:
      type: string
      enum: [local, ldap, oidc]
      description: Where an account comes from (rustryx-core `UserSource`).
      example: local
    RoleOrigin:
      type: string
      enum: [manual, oidc, ldap]
      description: Who put a role on a user (rustryx-core `RoleOrigin`).
      example: manual
    IdpProvider:
      type: string
      enum: [oidc, ldap]
      description: Identity provider kind of a group mapping (rustryx-core `IdpProvider`).
      example: oidc
    AuditKind:
      type: string
      enum: [login_success, login_failure, rbac_change, token_change, config_change, content_change]
      description: Category of an audit event (rustryx-core `AuditKind`). New kinds may be added; clients tolerate unknown
        values.
      example: config_change
    AuthMethod:
      type: string
      enum: [anonymous, basic_local, basic_ldap, api_token, internal_jwt, oidc_bearer]
      description: How a request was authenticated (rustryx-core `AuthMethod`).
      example: internal_jwt
    Checksums:
      type: object
      description: Lowercase hex digests of one blob (rustryx-core `Checksums`).
      properties:
        sha1:
          type: string
          pattern: ^[0-9a-f]{40}$
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        md5:
          type: string
          pattern: ^[0-9a-f]{32}$
      required: [sha1, sha256, md5]
      example:
        sha1: 2fd4e1c67a2d28fced849ee1bb76e7391b93eb12
        sha256: d7a8fbb307d7809469ca9abcb0082e4f8d5651e46d3cdb762d02d0bf37c9e592
        md5: 9e107d9d372bb6826bd81d3542a419d6
    RoleRef:
      type: object
      description: Lightweight role reference (rustryx-core `RoleRef`).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required: [id, name]
      example:
        id: 0192f6c4-5a1e-7000-8000-00000000000b
        name: nx-developer
    UserRef:
      type: object
      description: Small reference to a user, used for owners and authors.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: [string, 'null']
        source: {$ref: '#/components/schemas/UserSource'}
      required: [id, username, display_name, source]
      example:
        id: 0192f6c4-5a1e-7000-8000-000000000005
        username: alice
        display_name: Alice Example
        source: oidc
    RepositoryRef:
      type: object
      description: Small reference to a repository.
      properties:
        id:
          type: string
          format: uuid
        name: {$ref: '#/components/schemas/RepoName'}
        format: {$ref: '#/components/schemas/RepoFormat'}
        repo_type: {$ref: '#/components/schemas/RepoType'}
      required: [id, name, format, repo_type]
      example:
        id: 0192f6c4-5a1e-7000-8000-00000000001f
        name: maven-releases
        format: maven2
        repo_type: hosted
    BlobStoreRef:
      type: object
      description: Small reference to a blob store.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind: {$ref: '#/components/schemas/BlobStoreKind'}
      required: [id, name, kind]
      example:
        id: 0192f6c4-5a1e-7000-8000-000000000029
        name: default
        kind: local
    HealthState:
      type: object
      description: Health of a dependency as last observed by the node.
      properties:
        state:
          type: string
          enum: [ok, degraded, unreachable, unknown]
          description: '`unknown` is never green: the check did not run.'
        checked_at:
          type: [string, 'null']
          format: date-time
        last_error_code:
          type: [string, 'null']
          description: Stable code of the last failure, never raw backend text.
      required: [state, checked_at, last_error_code]
      example:
        state: ok
        checked_at: '2026-10-24T09:15:30Z'
        last_error_code: null
    Schedule:
      type: object
      description: When a task runs. All times are UTC.
      properties:
        type:
          type: string
          enum: [manual, once, hourly, daily, weekly, monthly, cron]
        cron:
          type: [string, 'null']
          description: Five field cron expression in UTC, for type `cron`.
          example: 0 2 * * *
        at:
          type: [string, 'null']
          format: date-time
          description: Run time for type `once`.
        next_runs:
          type: array
          items:
            type: string
            format: date-time
          description: Next five run times (read only), for the schedule picker preview.
          maxItems: 5
          readOnly: true
      required: [type]
      example:
        type: daily
        cron: null
        at: null
        next_runs: ['2026-10-24T09:15:30Z']
    SeveritySummary:
      type: object
      description: Counts of findings per severity. `fixable` counts findings with a fixed version.
      properties:
        critical:
          type: integer
          minimum: 0
          format: int64
        high:
          type: integer
          minimum: 0
          format: int64
        medium:
          type: integer
          minimum: 0
          format: int64
        low:
          type: integer
          minimum: 0
          format: int64
        negligible:
          type: integer
          minimum: 0
          format: int64
        unknown:
          type: integer
          minimum: 0
          format: int64
        fixable:
          type: integer
          minimum: 0
          format: int64
      required: [critical, high, medium, low, negligible, unknown, fixable]
      x-milestone: UI-M2
      example:
        critical: 0
        high: 2
        medium: 5
        low: 9
        negligible: 0
        unknown: 0
        fixable: 6
    Session:
      type: object
      description: 'State of the cookie session. Always answered with 200; an anonymous caller gets `authenticated: false`.'
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
          - {$ref: '#/components/schemas/UserRef'}
          - type: 'null'
        auth_method:
          oneOf:
          - {$ref: '#/components/schemas/AuthMethod'}
          - type: 'null'
        csrf_token:
          type: [string, 'null']
          description: CSRF token to send as `X-CSRF-Token` on unsafe requests. Bound to the session, not a credential by
            itself. Null when not authenticated or when the caller authenticated with a bearer credential.
        issued_at:
          type: [string, 'null']
          format: date-time
        idle_expires_at:
          type: [string, 'null']
          format: date-time
          description: Moves forward with activity (sliding), never past `absolute_expires_at`.
        absolute_expires_at:
          type: [string, 'null']
          format: date-time
          description: Hard end of the session (8 hours after login). Neither activity nor the Keycloak SSO session extends
            it.
        idle_timeout_secs:
          type: integer
          description: Configured idle timeout, at most 1800.
          format: int64
        absolute_timeout_secs:
          type: integer
          description: Configured absolute lifetime, at most 28800.
          format: int64
      required:
      - authenticated
      - user
      - auth_method
      - csrf_token
      - issued_at
      - idle_expires_at
      - absolute_expires_at
      - idle_timeout_secs
      - absolute_timeout_secs
      example:
        authenticated: true
        user:
          id: 0192f6c4-5a1e-7000-8000-000000000005
          username: alice
          display_name: Alice Example
          source: oidc
        auth_method: internal_jwt
        csrf_token: Zm9vYmFyYmF6cXV4
        issued_at: '2026-10-24T09:15:30Z'
        idle_expires_at: '2026-10-24T09:45:30Z'
        absolute_expires_at: '2026-10-24T17:15:30Z'
        idle_timeout_secs: 1800
        absolute_timeout_secs: 28800
    LoginRequest:
      type: object
      description: Username and password of a local or LDAP account.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
      required: [username, password]
      additionalProperties: false
      example:
        username: alice
        password: correct horse battery staple
    LogoutResult:
      type: object
      description: Result of a logout. The session and CSRF cookies are cleared by the response.
      properties:
        redirect_url:
          type: [string, 'null']
          format: uri
          description: When set, the SPA navigates there to end the Keycloak session too (RP-initiated logout). Null for
            local and LDAP sessions and while RP logout is not configured.
      required: [redirect_url]
      example:
        redirect_url: null
    CsrfToken:
      type: object
      description: The CSRF token of the current session.
      properties:
        csrf_token:
          type: string
      required: [csrf_token]
      example:
        csrf_token: Zm9vYmFyYmF6cXV4
    LoginProviders:
      type: object
      description: Public list of sign-in options for the login page. Reveals nothing beyond what the login page shows.
      properties:
        local:
          type: object
          description: 'Local accounts (always on: the break-glass administrator is local).'
          properties:
            enabled:
              type: boolean
          required: [enabled]
        ldap:
          type: object
          properties:
            enabled:
              type: boolean
              description: LDAP users use the same username and password form.
          required: [enabled]
        oidc:
          type: object
          properties:
            enabled:
              type: boolean
            available:
              type: boolean
              description: False while discovery has not reached Keycloak. The SPA disables the button and keeps the local
                form.
            display_name:
              type: [string, 'null']
              example: Corporate SSO
            login_path:
              type: [string, 'null']
              description: Path to open in the browser (top level navigation).
              example: /api/v1/auth/oidc/login
          required: [enabled, available, display_name, login_path]
      required: [local, ldap, oidc]
      example:
        local:
          enabled: true
        ldap:
          enabled: false
        oidc:
          enabled: true
          available: true
          display_name: Corporate SSO
          login_path: /api/v1/auth/oidc/login
    AuthProvidersDetails:
      type: object
      description: Read only view of the authentication configuration. Secrets are never returned, only `*_set` flags.
      properties:
        source:
          type: string
          enum: [file]
          description: Where the configuration comes from. UI-M1 shows the file configuration read only; UI-M2 adds editing.
        editable:
          type: boolean
        local:
          type: object
          properties:
            min_password_length:
              type: integer
              format: int64
            max_password_length:
              type: integer
              format: int64
            lockout_threshold:
              type: integer
              format: int64
            max_lockout_secs:
              type: integer
              format: int64
          required: [min_password_length, max_password_length, lockout_threshold, max_lockout_secs]
        ldap:
          type: object
          properties:
            enabled:
              type: boolean
            url:
              type: [string, 'null']
            starttls:
              type: boolean
            user_base_dn:
              type: [string, 'null']
            search_filter:
              type: [string, 'null']
            group_strategy:
              type: [string, 'null']
              enum: [member_of, member_search, null]
            group_attribute:
              type: [string, 'null']
            group_base_dn:
              type: [string, 'null']
            admin_groups:
              type: array
              items:
                type: string
            ca_configured:
              type: boolean
            bind_dn:
              type: [string, 'null']
            bind_password_set:
              type: boolean
            connect_timeout_secs:
              type: integer
              format: int64
            bind_timeout_secs:
              type: integer
              format: int64
            search_timeout_secs:
              type: integer
              format: int64
            groups_cache_ttl_secs:
              type: integer
              format: int64
          required: [enabled, url, starttls, admin_groups, bind_password_set]
        oidc:
          type: object
          properties:
            enabled:
              type: boolean
            issuer:
              type: [string, 'null']
            public_issuer_url:
              type: [string, 'null']
            client_id:
              type: [string, 'null']
            client_secret_set:
              type: boolean
            scopes:
              type: array
              items:
                type: string
            groups_claim:
              type: string
            admin_groups:
              type: array
              items:
                type: string
            default_role:
              type: [string, 'null']
            clock_skew_secs:
              type: integer
              format: int64
            redirect_uri:
              type: [string, 'null']
              description: Derived from `server.base_url`; register exactly this URI in Keycloak.
            discovery:
              type: object
              properties:
                loaded:
                  type: boolean
                reachable:
                  type: boolean
                last_success_at:
                  type: [string, 'null']
                  format: date-time
                jwks_keys:
                  type: integer
                  format: int64
              required: [loaded, reachable, last_success_at, jwks_keys]
          required: [enabled, client_secret_set, scopes, groups_claim, admin_groups, discovery]
      required: [source, editable, local, ldap, oidc]
      example:
        source: file
        editable: false
        local:
          min_password_length: 12
          max_password_length: 1024
          lockout_threshold: 5
          max_lockout_secs: 1800
        ldap:
          enabled: false
          url: null
          starttls: false
          admin_groups: []
          ca_configured: false
          bind_password_set: false
        oidc:
          enabled: true
          issuer: https://sso.example.org/realms/rustryx
          public_issuer_url: null
          client_id: rustryx-ui
          client_secret_set: true
          scopes: [openid, profile, email]
          groups_claim: groups
          admin_groups: [/rustryx/admins]
          default_role: null
          clock_skew_secs: 60
          redirect_uri: https://repo.example.org/api/v1/auth/oidc/callback
          discovery:
            loaded: true
            reachable: true
            last_success_at: '2026-10-24T09:15:30Z'
            jwks_keys: 2
    EffectiveRole:
      type: object
      description: A role the principal holds with where it comes from. Roles from groups cannot be removed in the UI.
      properties:
        role: {$ref: '#/components/schemas/RoleRef'}
        origin: {$ref: '#/components/schemas/RoleOrigin'}
        groups:
          type: array
          items:
            type: string
          description: External groups that produced the role (Keycloak paths or LDAP DNs). Empty for origin `manual`.
      required: [role, origin, groups]
      example:
        role:
          id: 0192f6c4-5a1e-7000-8000-00000000000b
          name: nx-developer
        origin: oidc
        groups: [/rustryx/team-payments/publishers]
    AdminArea:
      type: string
      enum:
      - users
      - roles
      - privileges
      - selectors
      - mappings
      - tokens
      - blobstores
      - tasks
      - settings
      - audit
      - system
      - scanners
      - registries
      - replication
      - webhooks
      - quotas
      - gc
      description: Administration area, matching the `app.<area>` privileges of AUTH-46. In phase 1 an administrator holds
        every area and nobody else any.
    RepositoryGrantSummary:
      type: object
      description: One effective repository grant, summarized for navigation. Authorization is always decided server side
        per request.
      properties:
        privilege:
          type: string
          description: Name of the privilege that grants it.
        repository:
          type: string
          description: Repository name or `*`.
        format:
          oneOf:
          - {$ref: '#/components/schemas/RepoFormat'}
          - type: 'null'
        actions:
          type: array
          items: {$ref: '#/components/schemas/Action'}
        selector:
          type: boolean
          description: True when a content selector narrows the grant to part of the repository.
      required: [privilege, repository, format, actions, selector]
      example:
        privilege: nx-repository-view-*-*
        repository: '*'
        format: null
        actions: [browse, read]
        selector: false
    PermissionSummary:
      type: object
      description: Effective permissions summary for the UI to show or hide entries. Hidden is a convenience, not security.
      properties:
        is_admin:
          type: boolean
        admin_areas:
          type: array
          items: {$ref: '#/components/schemas/AdminArea'}
        repository_grants:
          type: array
          items: {$ref: '#/components/schemas/RepositoryGrantSummary'}
        can:
          type: object
          properties:
            create_repository:
              type: boolean
            upload:
              type: boolean
              description: Write on at least one hosted repository.
            create_personal_token:
              type: boolean
            view_audit:
              type: boolean
            administer:
              type: boolean
          required: [create_repository, upload, create_personal_token, view_audit, administer]
      required: [is_admin, admin_areas, repository_grants, can]
      example:
        is_admin: false
        admin_areas: []
        repository_grants:
        - privilege: nx-repository-view-*-*
          repository: '*'
          format: null
          actions: [browse, read]
          selector: false
        can:
          create_repository: false
          upload: false
          create_personal_token: true
          view_audit: false
          administer: false
    TokenPolicy:
      type: object
      description: Lifetime rules for new API tokens.
      properties:
        default_ttl_days:
          type: integer
          format: int64
        max_ttl_days:
          type: integer
          format: int64
        require_expiry:
          type: boolean
      required: [default_ttl_days, max_ttl_days, require_expiry]
      example:
        default_ttl_days: 90
        max_ttl_days: 365
        require_expiry: true
    MeView:
      type: object
      description: The calling principal. For an anonymous caller `user` is null, `roles` is empty and `permissions` describes
        what `nx-anonymous` may see.
      properties:
        authenticated:
          type: boolean
        user:
          type: [object, 'null']
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            display_name:
              type: [string, 'null']
            email:
              type: [string, 'null']
            source: {$ref: '#/components/schemas/UserSource'}
            issuer:
              type: [string, 'null']
              description: OIDC issuer, only for source `oidc`.
            subject:
              type: [string, 'null']
              description: OIDC subject, only for source `oidc`.
            enabled:
              type: boolean
            created_at:
              type: string
              format: date-time
          required: [id, username, display_name, email, source, issuer, subject, enabled, created_at]
        auth_method: {$ref: '#/components/schemas/AuthMethod'}
        roles:
          type: array
          items: {$ref: '#/components/schemas/EffectiveRole'}
        groups:
          type: array
          items:
            type: string
          description: External group ids of this request (Keycloak paths or LDAP DNs), byte for byte.
        groups_confirmed_at:
          type: [string, 'null']
          format: date-time
          description: When the provider last confirmed the groups. LDAP data older than 5 minutes is dropped.
        token:
          type: [object, 'null']
          description: Set when the request used an API token.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            scopes:
              type: array
              items:
                type: string
          required: [id, name, scopes]
        permissions: {$ref: '#/components/schemas/PermissionSummary'}
        token_policy: {$ref: '#/components/schemas/TokenPolicy'}
        system:
          type: object
          properties:
            read_only:
              type: boolean
              description: Writes are refused (UI-M2 setting; false until then).
            anonymous_enabled:
              type: boolean
            base_url_configured:
              type: boolean
          required: [read_only, anonymous_enabled, base_url_configured]
      required:
      - authenticated
      - user
      - auth_method
      - roles
      - groups
      - groups_confirmed_at
      - token
      - permissions
      - token_policy
      - system
      example:
        authenticated: true
        user:
          id: 0192f6c4-5a1e-7000-8000-000000000005
          username: alice
          display_name: Alice Example
          email: alice@example.org
          source: oidc
          issuer: https://sso.example.org/realms/rustryx
          subject: 9f1c2f0e-1d2b-4b53-8f55-0a5f4cbb2c11
          enabled: true
          created_at: '2026-10-20T07:02:11Z'
        auth_method: internal_jwt
        roles:
        - role:
            id: 0192f6c4-5a1e-7000-8000-00000000000b
            name: nx-developer
          origin: oidc
          groups: [/rustryx/team-payments/publishers]
        groups: [/rustryx/team-payments/publishers]
        groups_confirmed_at: '2026-10-24T09:15:30Z'
        token: null
        permissions:
          is_admin: false
          admin_areas: []
          repository_grants:
          - privilege: nx-repository-view-*-*
            repository: '*'
            format: null
            actions: [browse, read]
            selector: false
          can:
            create_repository: false
            upload: false
            create_personal_token: true
            view_audit: false
            administer: false
        token_policy:
          default_ttl_days: 90
          max_ttl_days: 365
          require_expiry: true
        system:
          read_only: false
          anonymous_enabled: false
          base_url_configured: true
    PasswordChangeRequest:
      type: object
      description: Change of the own local password.
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
          description: 12 to 1024 bytes, not blank, must not start with `ryx_` (that prefix is the token namespace), and
            not on the offline list of compromised passwords.
      required: [current_password, new_password]
      additionalProperties: false
      example:
        current_password: old secret value 1
        new_password: a much longer new secret
    ApiToken:
      type: object
      description: An API token record (rustryx-core `ApiToken`) without `token_hash`. The secret is never part of it.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: Owner.
        name:
          type: string
          minLength: 1
          maxLength: 128
        display_prefix:
          type: string
          description: First characters of the token, safe to show.
        scopes:
          type: array
          items:
            type: string
            pattern: ^(\*|repo:(\*|[A-Za-z0-9][A-Za-z0-9._-]*):(browse|read|write|delete|\*))$
          description: 'Restriction of the owner''s rights. Empty means the owner''s rights. Grammar: `*` or `repo:<repository|*>:<browse|read|write|delete|*>`.'
        expires_at:
          type: [string, 'null']
          format: date-time
          description: 'Mandatory for tokens created through the API: 90 days by default, 365 at most.'
        revoked_at:
          type: [string, 'null']
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: Written at most once per minute per token.
        created_at:
          type: string
          format: date-time
      required: [id, user_id, name, display_prefix, scopes, expires_at, revoked_at, last_used_at, created_at]
      example:
        id: 0192f6c4-5a1e-7000-8000-00000000003d
        user_id: 0192f6c4-5a1e-7000-8000-000000000005
        name: ci-publisher
        display_prefix: ryx_Qk3T
        scopes: ['repo:maven-releases:write']
        expires_at: '2027-01-22T09:15:30Z'
        revoked_at: null
        last_used_at: '2026-10-24T09:15:30Z'
        created_at: '2026-10-20T07:02:11Z'
    ApiTokenView:
      description: API token with the fields the UI needs.
      allOf:
      - {$ref: '#/components/schemas/ApiToken'}
      - type: object
        properties:
          kind:
            type: string
            enum: [personal, robot, service]
            description: '`personal` in UI-M1. `robot` and `service` arrive with UI-M2 (rustryx-core `ApiToken` has no kind
              column yet).'
          state:
            type: string
            enum: [active, expired, revoked, disabled]
          owner: {$ref: '#/components/schemas/UserRef'}
          never_used:
            type: boolean
          project_id:
            type: [string, 'null']
            format: uuid
            description: Project of a project robot token. UI-M2.
        required: [kind, state, owner, never_used, project_id]
      example:
        id: 0192f6c4-5a1e-7000-8000-00000000003d
        user_id: 0192f6c4-5a1e-7000-8000-000000000005
        name: ci-publisher
        display_prefix: ryx_Qk3T
        scopes: ['repo:maven-releases:write']
        expires_at: '2027-01-22T09:15:30Z'
        revoked_at: null
        last_used_at: '2026-10-24T09:15:30Z'
        created_at: '2026-10-20T07:02:11Z'
        kind: personal
        state: active
        owner:
          id: 0192f6c4-5a1e-7000-8000-000000000005
          username: alice
          display_name: Alice Example
          source: oidc
        never_used: false
        project_id: null
    ApiTokenViewPage:
      type: object
      description: One page of ApiTokenView.
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ApiTokenView'}
        next:
          type: [string, 'null']
          description: Opaque token for the next page, null on the last page. Pass it as `after`.
      required: [items, next]
      example:
        items:
        - id: 0192f6c4-5a1e-7000-8000-00000000003d
          user_id: 0192f6c4-5a1e-7000-8000-000000000005
          name: ci-publisher
          display_prefix: ryx_Qk3T
          scopes: ['repo:maven-releases:write']
          expires_at: '2027-01-22T09:15:30Z'
          revoked_at: null
          last_used_at: '2026-10-24T09:15:30Z'
          created_at: '2026-10-20T07:02:11Z'
          kind: personal
          state: active
          owner:
            id: 0192f6c4-5a1e-7000-8000-000000000005
            username: alice
            display_name: Alice Example
            source: oidc
          never_used: false
          project_id: null
        next: null
    ApiTokenCreate:
      type: object
      description: New personal token.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          example: ci-publisher
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: Lifetime from now. There is no never-expire option for personal tokens.
          format: int32
        scopes:
          type: array
          items:
            type: string
            pattern: ^(\*|repo:(\*|[A-Za-z0-9][A-Za-z0-9._-]*):(browse|read|write|delete|\*))$
          default: []
          maxItems: 64
          description: Restriction of the owner's rights, validated up front (a malformed scope is a 400, never ignored).
            A restricted token can never reach administration endpoints.
      required: [name]
      additionalProperties: false
      example:
        name: ci-publisher
        expires_in_days: 90
        scopes: ['repo:maven-releases:write']
    ApiTokenCreated:
      description: The result of creating a token. The only schema in this document that carries a secret.
      allOf:
      - {$ref: '#/components/schemas/ApiTokenView'}
      - type: object
        properties:
          secret:
            type: string
            readOnly: true
            description: 'The token, `ryx_` plus 43 characters. Shown exactly once, in this response; only its SHA-256 is
              stored. The response is `Cache-Control: no-store` and must never be logged or kept by the client.'
        required: [secret]
      example:
        id: 0192f6c4-5a1e-7000-8000-00000000003d
        user_id: 0192f6c4-5a1e-7000-8000-000000000005
        name: ci-publisher
        display_prefix: ryx_Qk3T
        scopes: ['repo:maven-releases:write']
        expires_at: '2027-01-22T09:15:30Z'
        revoked_at: null
        last_used_at: null
        created_at: '2026-10-24T09:15:30Z'
        kind: personal
        state: active
        owner:
          id: 0192f6c4-5a1e-7000-8000-000000000005
          username: alice
          display_name: Alice Example
          source: oidc
        never_used: true
        project_id: null
        secret: ryx_EXAMPLE_ONLY_NOT_A_REAL_TOKEN_0000000000
    UserView:
      type: object
      description: A user account with role origins. Never contains a password hash.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        source: {$ref: '#/components/schemas/UserSource'}
        issuer:
          type: [string, 'null']
        subject:
          type: [string, 'null']
        email:
          type: [string, 'null']
        display_name:
          type: [string, 'null']
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
          description: Not stored by rustryx-core `User` today; null until a login timestamp exists.
        roles:
          type: array
          items: {$ref: '#/components/schemas/EffectiveRole'}
          description: Persisted role rows with origin. Rows of origin `oidc` or `ldap` are shown for information; they
            grant only while the current groups confirm them.
        groups_seen:
          type: [array, 'null']
          items:
            type: string
          description: External groups at the last login, best effort. Null when not recorded.
        token_count:
          type: integer
          minimum: 0
          description: Active tokens of the user.
          format: int64
        tokens_valid_after:
          type: [string, 'null']
          format: date-time
          description: Sessions issued before this instant are rejected.
        editable_fields:
          type: array
          items:
            type: string
            enum: [display_name, email, enabled, roles, password]
          description: Fields an administrator may change for this account. External accounts only allow `enabled` and manual
            `roles`.
        read_only_reason:
          type: [string, 'null']
          description: Why the other fields are read only, for the UI to show.
          example: Profile fields come from the identity provider.
      required:
      - id
      - username
      - source
      - issuer
      - subject
      - email
      - display_name
      - enabled
      - created_at
      - last_login_at
      - roles
      - groups_seen
      - token_count
      - tokens_valid_after
      - editable_fields
      - read_only_reason
      example:
        id: 0192f6c4-5a1e-7000-8000-000000000005
        username: alice
        source: oidc
        issuer: https://sso.example.org/realms/rustryx
        subject: 9f1c2f0e-1d2b-4b53-8f55-0a5f4cbb2c11
        email: alice@example.org
        display_name: Alice Example
        enabled: true
        created_at: '2026-10-20T07:02:11Z'
        last_login_at: '2026-10-24T09:15:30Z'
        roles:
        - role:
            id: 0192f6c4-5a1e-7000-8000-00000000000b
            name: nx-developer
          origin: oidc
          groups: [/rustryx/team-payments/publishers]
        groups_seen: [/rustryx/team-payments/publishers]
        token_count: 1
        tokens_valid_after: null
        editable_fields: [enabled, roles]
        read_only_reason: Profile fields come from the identity provider.
    UserViewPage:
      type: object
      description: One page of UserView.
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/UserView'}
        next:
          type: [string, 'null']
          description: Opaque token for the next page, null on the last page. Pass it as `after`.
      required: [items, next]
      example:
        items:
        - id: 0192f6c4-5a1e-7000-8000-000000000005
          username: alice
          source: oidc
          issuer: https://sso.example.org/realms/rustryx
          subject: 9f1c2f0e-1d2b-4b53-8f55-0a5f4cbb2c11
          email: alice@example.org
          display_name: Alice Example
          enabled: true
          created_at: '2026-10-20T07:02:11Z'
          last_login_at: '2026-10-24T09:15:30Z'
          roles:
          - role:
              id: 0192f6c4-5a1e-7000-8000-00000000000b
              name: nx-developer
            origin: oidc
            groups: [/rustryx/team-payments/publishers]
          groups_seen: [/rustryx/team-payments/publishers]
          token_count: 1
          tokens_valid_after: null
          editable_fields: [enabled, roles]
          read_only_reason: Profile fields come from the identity provider.
        next: null
    UserCreate:
      type: object
      description: A new local account.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._@-]*$
          description: Unique across all sources, compared case-insensitively.
        display_name:
          type: string
          maxLength: 256
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
          description: Same rules as for a password change. Optional policy check against the compromised list happens server
            side.
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 64
          default: []
          description: Manual roles. `nx-anonymous` is refused.
      required: [username, password]
      additionalProperties: false
      example:
        username: bob
