    get:
      operationId: listAuditEvents
      tags: [Audit]
      summary: Query audit events
      description: Newest first by default. Retention drops whole monthly partitions (90 days online by default), so older
        ranges are simply empty; the response says nothing about dropped data. Repository activity is this endpoint with
