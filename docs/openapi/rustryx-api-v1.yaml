        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/audit-events/export:
    get:
      operationId: exportAuditEvents
      tags: [Audit]
      summary: Export audit events as NDJSON
      description: |-
        Streams every matching event, oldest first, as newline delimited JSON (`application/x-ndjson`), one `AuditExportRecord` per line, UTF-8, each line terminated by `\n`, no envelope and no trailer. Use it for SIEM and archives. The range is limited to 366 days per request (400 `range_too_large`). Resume a cut-off stream with `after=<cursor of the last line>`. Backpressure applies: the server reads from the database as fast as the client consumes. Very large exports as a background job arrive with UI-M2.

        Audit: the export itself is recorded (`audit.export`) with the filter and the row count.
      x-milestone: UI-M1
      x-required-privilege: nx-admin
      x-future-privilege: app.audit.read
      x-audit:
        kind: config_change
        action: audit.export
      parameters:
      - {$ref: '#/components/parameters/After'}
      - name: kind
        in: query
        description: One or more kinds.
        schema:
          type: array
          items: {$ref: '#/components/schemas/AuditKind'}
          uniqueItems: true
        style: form
        explode: false
      - name: actor_id
        in: query
        description: Acting user id.
        schema:
          type: string
          format: uuid
      - name: actor
        in: query
        description: Actor name prefix.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: action
        in: query
        description: Action label or prefix ending with `.`, for example `role.`.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: target
        in: query
        description: Exact target.
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: repository
        in: query
        description: Events whose target is this repository or a path or component inside it.
        schema: {$ref: '#/components/schemas/RepoName'}
      - name: outcome
        in: query
        description: Outcome.
        schema:
          type: string
          enum: [success, failure]
      - name: request_id
        in: query
        description: Exact request id.
        schema:
          type: string
          maxLength: 64
      - name: from
        in: query
        description: Event time at or after (inclusive).
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Event time before (exclusive).
        schema:
          type: string
          format: date-time
      - name: project
        in: query
        description: Project (UI-M2).
        schema:
          type: string
      security:
      - {sessionCookie: []}
      - {apiToken: []}
      - {keycloakToken: []}
      responses:
        '200':
          description: NDJSON stream.
          headers:
            Content-Disposition: {$ref: '#/components/headers/ContentDispositionHeader'}
            X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
          content:
            application/x-ndjson:
              schema:
                type: string
                description: NDJSON stream. Each line is an `AuditExportRecord`.
                x-item-schema: {$ref: '#/components/schemas/AuditExportRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
