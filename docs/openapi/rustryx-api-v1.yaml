components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rustryx_session
      description: 'Browser session issued by `POST /api/v1/auth/login` or the OIDC callback: an HttpOnly, Secure, SameSite=Lax
        cookie carrying the internal JWT (EdDSA). Idle timeout 30 minutes, absolute 8 hours. Combine with `csrfToken` on
        every unsafe method.'
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token of the session (signed double submit). Required together with `sessionCookie` on POST, PUT,
        PATCH and DELETE, and the `Origin` header must be the service origin. Take it from `GET /api/v1/auth/session` or
        the `__Host-rustryx_csrf` cookie. Bearer credentials are not subject to CSRF and must not send it.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: ryx_*
      description: Personal or robot API token `ryx_...` (47 characters). Also accepted as the password of HTTP Basic for
        tools that cannot send Bearer. Only the SHA-256 of the token is stored; scopes narrow the owner's rights and a scope
        restricted token is never an administrator.
    keycloakToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token (RS256 or ES256, validated against the JWKS; `aud` contains the product client
        id). For CLI and CI. ID tokens, offline tokens and `alg=none` are refused.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum items per page. Values above the maximum are clamped, values below 1 are a 400.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
        format: int64
    LimitSmall:
      name: limit
      in: query
      description: Maximum items per page (heavy endpoint). Values above 200 are clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        format: int64
    After:
      name: after
      in: query
      description: 'Opaque page token: the `next` of the previous page. Valid only with the same filters and sort.'
      schema:
        type: string
        maxLength: 2048
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being changed (from the last GET or write). Required.
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      description: ETag of the version being deleted. Optional; when present it is enforced (412 on mismatch).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'Optional client chosen key. A retry with the same key and the same body within 24 hours returns the
        first response (`Idempotent-Replayed: true`); the same key with another body is 409 `idempotency_conflict`.'
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    RepositoryName:
      name: name
      in: path
      required: true
      description: Repository name.
      schema: {$ref: '#/components/schemas/RepoName'}
    RepositoryFilter:
      name: repository
      in: query
