          format: int32
      required: [role_id, priority]
      additionalProperties: false
      example:
        role_id: 0192f6c4-5a1e-7000-8000-00000000000c
        priority: 50
    MappingTestRequest:
      type: object
      description: A group list to resolve.
      properties:
        provider: {$ref: '#/components/schemas/IdpProvider'}
        groups:
          type: array
          items:
            type: string
            maxLength: 512
          minItems: 1
          maxItems: 256
      required: [provider, groups]
      additionalProperties: false
      example:
        provider: oidc
        groups: [/rustryx/team-payments/publishers, /rustryx/unknown]
    MappingTestResult:
      type: object
      description: The roles the group list would produce with the current configuration and table.
      properties:
        roles:
          type: array
          items:
            type: object
            properties:
              role: {$ref: '#/components/schemas/RoleRef'}
              via:
                type: string
                enum: [admin_group, mapping, default_role]
              group:
                type: [string, 'null']
              mapping_id:
                type: [string, 'null']
                format: uuid
            required: [role, via, group, mapping_id]
        unmatched_groups:
          type: array
          items:
            type: string
          description: Groups that grant nothing.
        denied:
          type: boolean
          description: 'True when no role results and there is no default role: the login would be refused (not treated
            as anonymous).'
      required: [roles, unmatched_groups, denied]
      example:
        roles:
        - role:
            id: 0192f6c4-5a1e-7000-8000-00000000000c
            name: maven-publishers
          via: mapping
          group: /rustryx/team-payments/publishers
          mapping_id: 0192f6c4-5a1e-7000-8000-000000000065
        unmatched_groups: [/rustryx/unknown]
        denied: false
    AnonymousAccess:
      type: object
      description: Anonymous access state.
      properties:
        global_enabled:
          type: boolean
          description: '`auth.anonymous_enabled`.'
        global_editable:
          type: boolean
          description: 'False while the value comes from the configuration file or environment (UI-M1 default): changing
            it needs a configuration change.'
        anonymous_role: {$ref: '#/components/schemas/RoleRef'}
        public_repository_count:
          type: integer
          minimum: 0
          description: Repositories with `allow_anonymous = true`.
          format: int64
        effective_repository_count:
          type: integer
          minimum: 0
          description: 'Repositories anonymous callers can actually browse now: both switches on.'
          format: int64
      required:
      - global_enabled
      - global_editable
      - anonymous_role
      - public_repository_count
      - effective_repository_count
      example:
        global_enabled: false
        global_editable: false
        anonymous_role:
          id: 0192f6c4-5a1e-7000-8000-00000000000d
          name: nx-anonymous
        public_repository_count: 2
        effective_repository_count: 0
    AnonymousAccessUpdate:
      type: object
      description: Change of the global switch.
      properties:
        global_enabled:
          type: boolean
      required: [global_enabled]
      additionalProperties: false
      example:
        global_enabled: true
    AnonymousRepositoriesRequest:
      type: object
      description: Bulk change of the per repository flag, applied in one transaction (all or nothing).
      properties:
        repositories:
          type: array
          items:
            type: object
            properties:
              name: {$ref: '#/components/schemas/RepoName'}
              allow_anonymous:
                type: boolean
            required: [name, allow_anonymous]
            additionalProperties: false
          minItems: 1
          maxItems: 500
      required: [repositories]
      additionalProperties: false
      example:
        repositories:
        - name: maven-public
          allow_anonymous: true
        - name: npm-internal
          allow_anonymous: false
    AnonymousRepositoriesResult:
      type: object
      description: Number of repositories whose flag changed.
      properties:
        updated:
          type: integer
          minimum: 0
          format: int64
      required: [updated]
      example:
        updated: 2
    UpstreamAuth:
      type: object
      description: Upstream credentials as shown by the API (rustryx-core `UpstreamAuth` without the password).
      properties:
        username:
          type: string
        password_set:
          type: boolean
          description: True when a password is stored. The password is never returned.
      required: [username, password_set]
      example:
        username: mirror-reader
        password_set: true
    ProxyConfig:
      type: object
      description: Settings of a proxy repository (rustryx-core `ProxyConfig`, credentials redacted).
      properties:
        remote_url:
          type: string
          format: uri
          description: Upstream base URL. Passed through the SSRF filter on save and on every use.
        auth:
          oneOf:
          - {$ref: '#/components/schemas/UpstreamAuth'}
          - type: 'null'
        content_max_age_secs:
          type: integer
          minimum: 0
          description: Seconds a cached artifact is fresh.
          format: int64
        metadata_max_age_secs:
          type: integer
          minimum: 0
          description: Seconds cached metadata is fresh.
          format: int64
        negative_cache_ttl_secs:
          type: integer
          minimum: 0
          description: Seconds a 404 from upstream is remembered.
          format: int64
        max_concurrent_upstream:
          type: integer
          minimum: 1
          maximum: 256
          description: Cap of concurrent upstream requests of this repository.
          format: int32
      required:
      - remote_url
      - auth
      - content_max_age_secs
      - metadata_max_age_secs
      - negative_cache_ttl_secs
      - max_concurrent_upstream
      example:
        remote_url: https://registry.npmjs.org
        auth: null
        content_max_age_secs: 86400
        metadata_max_age_secs: 1800
        negative_cache_ttl_secs: 3600
        max_concurrent_upstream: 16
    GroupConfig:
      type: object
      description: Settings of a group repository (rustryx-core `GroupConfig`).
      properties:
        members:
          type: array
          items: {$ref: '#/components/schemas/RepoName'}
          description: 'Member repository names in resolution order: the first member that has a path wins. Members must
            have the format of the group; groups may nest (depth limit 4).'
      required: [members]
      example:
        members: [maven-releases, maven-central]
    UpstreamAuthInput:
      type: object
      description: Upstream basic credentials.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: Sealed (AES-256-GCM) at rest and never returned. On update, omit it to keep the stored password.
      required: [username]
      additionalProperties: false
      example:
        username: mirror-reader
        password: an upstream password
    ProxyConfigInput:
      type: object
      description: Proxy settings for create. A `remote_url` refused by the SSRF filter is 400 `upstream_url_rejected` with
        the rule in `details.rule`.
      properties:
        remote_url:
          type: string
          format: uri
          maxLength: 2048
        auth:
          oneOf:
          - {$ref: '#/components/schemas/UpstreamAuthInput'}
          - type: 'null'
        content_max_age_secs:
          type: integer
          minimum: 0
          maximum: 31536000
          default: 86400
          format: int64
        metadata_max_age_secs:
          type: integer
          minimum: 0
          maximum: 31536000
          default: 1800
          format: int64
        negative_cache_ttl_secs:
          type: integer
          minimum: 0
          maximum: 86400
          default: 3600
          format: int64
        max_concurrent_upstream:
          type: integer
          minimum: 1
          maximum: 256
          default: 16
          format: int32
      required: [remote_url]
      additionalProperties: false
      example:
        remote_url: https://registry.npmjs.org
        auth: null
        content_max_age_secs: 86400
        metadata_max_age_secs: 1800
        negative_cache_ttl_secs: 3600
        max_concurrent_upstream: 16
    ProxyConfigPatch:
      type: object
      description: 'Merge patch of proxy settings. `auth: null` removes the credentials; `auth` without `password` keeps
        the stored password.'
      properties:
        remote_url:
          type: string
          format: uri
          maxLength: 2048
        auth:
          oneOf:
          - {$ref: '#/components/schemas/UpstreamAuthInput'}
          - type: 'null'
        content_max_age_secs:
          type: integer
          minimum: 0
          maximum: 31536000
          format: int64
        metadata_max_age_secs:
          type: integer
          minimum: 0
          maximum: 31536000
          format: int64
        negative_cache_ttl_secs:
          type: integer
          minimum: 0
          maximum: 86400
          format: int64
        max_concurrent_upstream:
          type: integer
          minimum: 1
          maximum: 256
          format: int32
      additionalProperties: false
      example:
        metadata_max_age_secs: 600
    Repository:
      type: object
      description: 'A repository (rustryx-core `Repository`): `proxy` is present exactly for proxy repositories, `group`
        exactly for group repositories. Differences to the serde output of the core type: credentials are redacted and timestamps
        are RFC 3339 strings.'
      properties:
        id:
          type: string
          format: uuid
        name: {$ref: '#/components/schemas/RepoName'}
        format: {$ref: '#/components/schemas/RepoFormat'}
        repo_type: {$ref: '#/components/schemas/RepoType'}
        blob_store_id:
          type: string
          format: uuid
        write_policy: {$ref: '#/components/schemas/WritePolicy'}
        allow_anonymous:
          type: boolean
          description: Anonymous read is allowed here. Also needs the global switch.
        online:
          type: boolean
          description: Offline repositories answer 503 for reads of content.
        quota_bytes:
          type: [integer, 'null']
          minimum: 0
          description: Size limit over distinct blobs.
          format: int64
        cleanup_policy_ids:
          type: array
          items:
            type: string
            format: uuid
        routing_rule_id:
          type: [string, 'null']
          format: uuid
        proxy:
          oneOf:
          - {$ref: '#/components/schemas/ProxyConfig'}
          - type: 'null'
        group:
          oneOf:
          - {$ref: '#/components/schemas/GroupConfig'}
          - type: 'null'
        format_config:
          type: object
          additionalProperties: true
          description: Format specific settings; the schema is `config_schema` of `GET /api/v1/formats`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - format
      - repo_type
      - blob_store_id
      - write_policy
      - allow_anonymous
      - online
      - quota_bytes
      - cleanup_policy_ids
      - routing_rule_id
      - proxy
      - group
      - format_config
      - created_at
      - updated_at
      example:
        id: 0192f6c4-5a1e-7000-8000-00000000001f
        name: maven-releases
        format: maven2
        repo_type: hosted
        blob_store_id: 0192f6c4-5a1e-7000-8000-000000000029
        write_policy: allow_once
        allow_anonymous: false
        online: true
        quota_bytes: null
        cleanup_policy_ids: [0192f6c4-5a1e-7000-8000-00000000006f]
        routing_rule_id: null
        proxy: null
        group: null
        format_config:
          version_policy: release
          layout_policy: strict
        created_at: '2026-10-20T07:02:11Z'
        updated_at: '2026-10-24T09:15:30Z'
    RepositoryPermissions:
      type: object
      description: What the caller may do on one repository, for the UI to enable or disable actions.
      properties:
        browse:
          type: boolean
        read:
          type: boolean
        write:
          type: boolean
        delete:
          type: boolean
        admin:
          type: boolean
          description: 'Configure the repository (phase 1: `nx-admin`).'
      required: [browse, read, write, delete, admin]
      example:
        browse: true
        read: true
        write: true
        delete: false
        admin: false
    RepositoryStats:
      type: object
      description: Usage of a repository.
      properties:
        component_count:
          type: integer
          minimum: 0
          format: int64
        asset_count:
          type: integer
          minimum: 0
          format: int64
        size_bytes:
          type: integer
          minimum: 0
          description: Distinct blobs referenced by the repository.
          format: int64
        as_of:
          type: string
          format: date-time
          description: Statistics may be a few minutes old.
      required: [component_count, asset_count, size_bytes, as_of]
      example:
        component_count: 1240
        asset_count: 5310
        size_bytes: 8123456789
        as_of: '2026-10-24T09:15:30Z'
    UpstreamStatus:
      type: object
      description: Runtime status of the upstream of a proxy repository, as seen by the answering node.
      properties:
        state:
          type: string
          enum: [ok, degraded, blocked, auto_blocked, unknown]
          description: '`blocked` is the manual block, `auto_blocked` the circuit breaker.'
        blocked_until:
          type: [string, 'null']
          format: date-time
        last_error_code:
          type: [string, 'null']
          description: Stable error code, never raw upstream text.
        last_checked_at:
          type: [string, 'null']
          format: date-time
        circuit:
          type: string
          enum: [closed, half_open, open]
      required: [state, blocked_until, last_error_code, last_checked_at, circuit]
      example:
        state: ok
        blocked_until: null
        last_error_code: null
        last_checked_at: '2026-10-24T09:15:30Z'
        circuit: closed
    RepositoryView:
      description: A repository with the view fields the UI needs.
      allOf:
