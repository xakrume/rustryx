    get:
      operationId: listComponents
      tags: [Components]
      summary: List components
      description: Components of repositories the caller may browse (content selectors are evaluated per item, so a page
        may hold fewer items than `limit`). Exact filters; use the search endpoints for text queries across repositories.
      x-milestone: UI-M1
      x-required-privilege: repo.browse(R) per item
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/After'}
      - {$ref: '#/components/parameters/RepositoryFilter'}
      - name: group
        in: query
        description: Exact namespace.
        schema:
          type: string
      - name: name
        in: query
        description: Exact name.
        schema:
          type: string
      - name: version
        in: query
        description: 'Exact version (OCI: tag).'
        schema:
          type: string
      - name: q
        in: query
        description: Full text over group, name and version.
        schema:
          type: string
          minLength: 1
          maxLength: 128
