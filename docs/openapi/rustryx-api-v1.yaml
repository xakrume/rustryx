    RoutingRule:
      type: object
      description: A routing rule. Rules are checked before the cache lookup, so a new block rule applies at once to cached
        content too.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        mode:
          type: string
          enum: [allow, block]
          description: '`block`: matching paths are refused. `allow`: only matching paths pass.'
        patterns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
          minItems: 1
          maxItems: 50
          description: Regular expressions (linear time engine, no backreferences or lookaround), matched against the whole
            path as classified by the format (normalized, leading slash).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, description, mode, patterns, created_at, updated_at]
      example:
        id: 0192f6c4-5a1e-7000-8000-000000000079
        name: block-snapshots
        description: No snapshots from upstream
        mode: block
        patterns: [^/.*-SNAPSHOT/.*$]
        created_at: '2026-10-20T07:02:11Z'
        updated_at: '2026-10-24T09:15:30Z'
    RoutingRuleView:
      description: A rule with its repositories.
      allOf:
      - {$ref: '#/components/schemas/RoutingRule'}
      - type: object
        properties:
          assigned_repositories:
            type: array
            items: {$ref: '#/components/schemas/RepositoryRef'}
        required: [assigned_repositories]
      example:
        id: 0192f6c4-5a1e-7000-8000-000000000079
        name: block-snapshots
        description: No snapshots from upstream
        mode: block
        patterns: [^/.*-SNAPSHOT/.*$]
        created_at: '2026-10-20T07:02:11Z'
        updated_at: '2026-10-24T09:15:30Z'
        assigned_repositories:
        - id: 0192f6c4-5a1e-7000-8000-000000000020
          name: maven-central
          format: maven2
          repo_type: proxy
    RoutingRuleViewPage:
      type: object
      description: One page of RoutingRuleView.
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RoutingRuleView'}
        next:
          type: [string, 'null']
          description: Opaque token for the next page, null on the last page. Pass it as `after`.
      required: [items, next]
      example:
        items:
        - id: 0192f6c4-5a1e-7000-8000-000000000079
          name: block-snapshots
          description: No snapshots from upstream
          mode: block
          patterns: [^/.*-SNAPSHOT/.*$]
          created_at: '2026-10-20T07:02:11Z'
          updated_at: '2026-10-24T09:15:30Z'
          assigned_repositories:
          - id: 0192f6c4-5a1e-7000-8000-000000000020
            name: maven-central
            format: maven2
            repo_type: proxy
        next: null
    RoutingRuleInput:
      type: object
      description: Create or replace a routing rule. A pattern the engine cannot compile is 400 `invalid_pattern` with its
        index in `details.fields`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
          default: ''
        mode:
          type: string
          enum: [allow, block]
        patterns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
          minItems: 1
          maxItems: 50
      required: [name, mode, patterns]
      additionalProperties: false
      example:
        name: block-snapshots
        description: No snapshots from upstream
        mode: block
        patterns: [^/.*-SNAPSHOT/.*$]
    RoutingPatternIssue:
      type: object
      description: A pattern the linter rejects, with the position of the error.
      properties:
        index:
          type: integer
          minimum: 0
          format: int64
        offset:
          type: [integer, 'null']
          minimum: 0
          format: int64
        message:
          type: string
      required: [index, offset, message]
      example:
        index: 1
        offset: 0
        message: look-around is not supported
    RoutingValidateRequest:
      type: object
      description: Patterns to lint.
      properties:
        patterns:
          type: array
          items:
            type: string
            maxLength: 2048
          minItems: 1
          maxItems: 50
      required: [patterns]
      additionalProperties: false
      example:
        patterns: [^/a/.*$, '(?<=x)y']
    RoutingValidateResult:
      type: object
      description: Lint result; always 200.
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items: {$ref: '#/components/schemas/RoutingPatternIssue'}
      required: [valid, errors]
      example:
        valid: false
        errors:
        - index: 1
          offset: 0
          message: look-around is not supported
    RoutingTestRequest:
      type: object
      description: Paths to test against a saved rule.
      properties:
        paths:
          type: array
          items:
            type: string
            maxLength: 2048
          minItems: 1
          maxItems: 100
      required: [paths]
      additionalProperties: false
      example:
        paths: [/com/example/lib/1.0-SNAPSHOT/lib-1.0-SNAPSHOT.jar]
    RoutingDraftTestRequest:
      type: object
      description: An unsaved rule and paths to test it with.
      properties:
        mode:
          type: string
          enum: [allow, block]
        patterns:
          type: array
          items:
            type: string
            maxLength: 2048
          minItems: 1
          maxItems: 50
        paths:
          type: array
          items:
            type: string
            maxLength: 2048
          minItems: 1
          maxItems: 100
      required: [mode, patterns, paths]
      additionalProperties: false
      example:
        mode: block
        patterns: [^/.*-SNAPSHOT/.*$]
        paths: [/a/b-SNAPSHOT/c.jar]
    RoutingTestResult:
      type: object
      description: Verdict per path, in order.
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              outcome:
                type: string
                enum: [allowed, blocked]
              matched_pattern:
                type: [string, 'null']
              reason:
                type: string
                description: Plain words, for example `matches a block pattern`.
            required: [path, outcome, matched_pattern, reason]
      required: [items]
      example:
        items:
        - path: /a/b-SNAPSHOT/c.jar
          outcome: blocked
          matched_pattern: ^/.*-SNAPSHOT/.*$
          reason: matches a block pattern
    TaskRun:
      type: object
      description: One execution of a task. Long running operations return a task run with 202 and a `Location` to poll.
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, aborted]
          description: '`aborted`: the run lost its lock or its node died.'
        dry_run:
          type: boolean
        trigger:
          type: string
          enum: [schedule, manual, api, startup]
