    RepositoryCreate:
      type: object
      description: 'Create a repository. Rules by type: `hosted` takes `write_policy` (default `allow_once` for release
        style formats, see `default_write_policy` of the format) and no `proxy` or `group`; `proxy` requires `proxy` and
        ignores `write_policy`; `group` takes `group` (members of the same format, existing, no self reference). `name`,
        `format`, `repo_type` and `blob_store_id` cannot change later.'
      properties:
        name: {$ref: '#/components/schemas/RepoName'}
        format: {$ref: '#/components/schemas/RepoFormat'}
        repo_type: {$ref: '#/components/schemas/RepoType'}
        blob_store_id:
          type: string
          format: uuid
          description: Fixed after creation (changing it is a later feature).
        write_policy: {$ref: '#/components/schemas/WritePolicy'}
        allow_anonymous:
          type: boolean
          default: false
        online:
          type: boolean
          default: true
        quota_bytes:
          type: [integer, 'null']
          minimum: 0
          format: int64
        cleanup_policy_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
          maxItems: 16
          description: Policies of the same format as the repository.
        routing_rule_id:
          type: [string, 'null']
          format: uuid
          description: Proxy and group repositories only.
        proxy: {$ref: '#/components/schemas/ProxyConfigInput'}
        group: {$ref: '#/components/schemas/GroupConfig'}
        format_config:
          type: object
          additionalProperties: true
          description: Validated against the format `config_schema`.
      required: [name, format, repo_type, blob_store_id]
      additionalProperties: false
      example:
        name: maven-releases
        format: maven2
        repo_type: hosted
        blob_store_id: 0192f6c4-5a1e-7000-8000-000000000029
        write_policy: allow_once
        cleanup_policy_ids: [0192f6c4-5a1e-7000-8000-00000000006f]
        format_config:
          version_policy: release
          layout_policy: strict
    RepositoryPatch:
      type: object
      description: 'JSON Merge Patch of the mutable fields. `name`, `format`, `repo_type` and `blob_store_id` are immutable:
        sending a different value is 400 `immutable_field`; the same value is accepted. Uses PATCH because proxy credentials
        are write only and must not be echoed back.'
      properties:
        write_policy: {$ref: '#/components/schemas/WritePolicy'}
        allow_anonymous:
          type: boolean
        online:
          type: boolean
        quota_bytes:
          type: [integer, 'null']
          minimum: 0
          format: int64
        cleanup_policy_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 16
        routing_rule_id:
          type: [string, 'null']
          format: uuid
        proxy: {$ref: '#/components/schemas/ProxyConfigPatch'}
        group: {$ref: '#/components/schemas/GroupConfig'}
        format_config:
          type: object
          additionalProperties: true
          description: Merged key by key; a key set to null is removed.
      additionalProperties: false
      example:
        online: false
    CacheInvalidation:
      type: object
      description: When the cache was marked stale.
      properties:
