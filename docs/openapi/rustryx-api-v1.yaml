          description: Versions of one package to keep, newest first; older ones match.
          format: int32
        name_pattern:
          type: [string, 'null']
          maxLength: 512
          description: Regular expression (linear time engine, no backreferences) matched against the whole component name.
        release_type:
          type: [string, 'null']
          enum: [release, prerelease, null]
          description: 'Maven only: version kind to match.'
      required: [older_than_days, last_downloaded_days, keep_last_versions, name_pattern, release_type]
