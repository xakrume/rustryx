      - {apiToken: []}
      - {keycloakToken: []}
      responses:
        '200':
          description: A page of components.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComponentViewPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: uploadComponent
      tags: [Upload]
      summary: Upload a component
      description: |-
        `multipart/form-data`: part `attributes` (`application/json`, built from `GET /formats/{format}/upload-schema`) and one or more `file` parts. Streamed, never buffered whole. Runs the same publish path as the native client protocols, so write policy, content selectors, immutability, quota, audit and webhooks apply exactly once. Hosted repositories only.

        Needs `repo.write(R)` on the repository named by the query parameter. Idempotency: with `Idempotency-Key` a retry within 24 hours returns the first result; without it a retry of identical bytes is safe under write policy `allow`, and under `allow_once` it answers 409 `write_policy_violation`.

        Errors: 400 `invalid_input` (field errors, wrong extension), `digest_mismatch`; 409 `repository_not_hosted`, `write_policy_violation` (`details.policy`), `immutable_tag` (UI-M2); 413 `payload_too_large`; 507 `quota_exceeded` (`details.limit_bytes`, `details.used_bytes`). A client that disconnects mid upload leaves nothing behind: the staged blob is aborted.
      x-milestone: UI-M1
      x-required-privilege: repo.write(R)
      x-audit:
        kind: content_change
        action: asset.publish
      parameters:
      - name: repository
        in: query
        required: true
        description: Target hosted repository.
        schema: {$ref: '#/components/schemas/RepoName'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ComponentUploadRequest'}
            encoding:
              attributes:
                contentType: application/json
              file:
                contentType: application/octet-stream
      security:
      - {sessionCookie: [], csrfToken: []}
      - {apiToken: []}
      - {keycloakToken: []}
      responses:
        '201':
          description: Component published.
          headers:
            Location: {$ref: '#/components/headers/LocationHeader'}
            X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: '`repository_not_found` (also for a repository the caller may not browse).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '507': {$ref: '#/components/responses/InsufficientStorage'}
