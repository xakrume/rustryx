# Rustryx native API v1, OpenAPI 3.1.
# Source of truth for the web UI (generated TypeScript client) and for the native API handlers.
# Conventions, error catalogue and the page to operation map: docs/api-conventions.md.
# Validate with docs/openapi/check.sh.
openapi: 3.1.0
info:
  title: Rustryx native API
  version: 1.0.0-draft.1
  summary: Native REST API of Rustryx for the web UI, the CLI and automation.
  description: |-
    The native REST API of Rustryx, an artifact manager. It is the only API the web UI talks to and the contract the backend handlers are built against.

    **Base path** `/api/v1`. compat v1 compatibility endpoints live under `/service/rest/v1` and are not described here.

    **Milestones.** Every operation carries `x-milestone`: `UI-M1` is the usable core (sign in, repositories, browse, search, upload, administration of identity and content, audit, status), `UI-M2` is the Harbor parity wave (projects, robot tokens, labels, retention, immutability, quotas, scanning, webhooks, replication, promotion, trust policies, garbage collection, more settings). UI-M2 schemas are deliberately lighter and may gain fields; their names and conventions are stable.

    **Privileges.** `x-required-privilege` states what the operation needs, in the grammar of docs/api-conventions.md (`anonymous`, `authenticated`, `interactive`, `nx-admin`, `repo.<action>(R)`, `project.<role>(P)`). In phase 1 every administration operation needs `nx-admin`; `x-future-privilege` names the per area privilege that replaces it later (AUTH-46).

    **Errors.** Every error is `{error:{code,message,request_id}}` with a stable `code` (catalogue in docs/api-conventions.md); `details` is an optional additive extension.

    **Lists** use keyset pagination: `limit`, `after`, response `{items, next}`.

    **Concurrent edits.** Mutable administration objects return an `ETag`; `PUT` and `PATCH` require `If-Match` (412 on mismatch, 428 when missing).

    **Secrets** never appear in responses. An API token (or webhook secret) is returned once, by the create operation and by rotation. Write only fields are marked `writeOnly`.
  contact:
    name: Rustryx maintainers
  license:
    name: MIT
    identifier: MIT
servers:
- url: /
  description: Same origin as the web UI. All paths below include the `/api/v1` prefix.
security:
- {sessionCookie: [], csrfToken: []}
- {apiToken: []}
- {keycloakToken: []}
tags:
- name: Auth
  description: Login, session, CSRF and OIDC redirect flow. The UI session is a cookie; tools use bearer tokens.
  x-milestone: UI-M1
- name: Me
  description: 'The calling principal: identity, effective roles with origin, permission summary, own password and personal
    tokens.'
  x-milestone: UI-M1
- name: API tokens
  description: 'All tokens of the system for administrators: list, inspect, revoke. UI-M2 adds robot and service tokens.'
  x-milestone: UI-M1
- name: Users
  description: Accounts of all sources. Local accounts are managed here; LDAP and OIDC accounts are provisioned by login
    and are mostly read only.
  x-milestone: UI-M1
- name: Privileges
  description: 'Privileges: repository view and content selector grants with actions. Privileges only allow, there are no
    deny rules.'
  x-milestone: UI-M1
- name: Roles
  description: Roles group privileges and nest other roles. `nx-admin`, `nx-anonymous` and `nx-developer` are built in and
    read only.
  x-milestone: UI-M1
- name: Content selectors
  description: Boolean expressions over `format`, `path`, `repository` and `coordinate.*` that narrow a repository privilege
    to part of its content.
  x-milestone: UI-M1
- name: IdP group mappings
  description: Mapping of external groups (Keycloak full group path, LDAP DN) to roles. `nx-admin` is reachable only through
    the configured admin groups.
  x-milestone: UI-M1
- name: Anonymous access
  description: 'The two anonymous switches: the global one and the per repository flag. Anonymous needs both and never gets
    write access.'
  x-milestone: UI-M1
- name: Repositories
  description: 'Hosted, proxy and group repositories: configuration, status and actions.'
  x-milestone: UI-M1
- name: Blob stores
  description: 'Storage backends for content: local directories and S3 compatible object stores. Secrets are write only.'
  x-milestone: UI-M1
- name: Formats
  description: 'Per format capabilities: configuration schema, supported repository types, upload form schema.'
  x-milestone: UI-M1
- name: Browse
  description: Lazy path tree of a repository.
  x-milestone: UI-M1
- name: Components
  description: 'Logical package versions: list, detail, delete.'
  x-milestone: UI-M1
- name: Assets
  description: 'Files addressed by repository and path: list, detail, delete.'
  x-milestone: UI-M1
- name: Search
  description: Cross repository search over components and assets with keyset pagination.
  x-milestone: UI-M1
- name: Upload
  description: Upload components through the web UI and the native API.
  x-milestone: UI-M1
- name: Client setup
  description: Ready to paste client configuration snippets per repository, produced by the server from templates that live
    with the format crates.
  x-milestone: UI-M1
- name: Cleanup policies
  description: Criteria that select components for removal, attached to repositories. A preview is a stored dry run.
  x-milestone: UI-M1
- name: Routing rules
  description: Allow or block patterns on request paths of proxy and group repositories.
  x-milestone: UI-M1
- name: Lifecycle runs
  description: Plans and reports of cleanup (UI-M1) and retention (UI-M2) runs, including dry runs.
  x-milestone: UI-M1
- name: Tasks
  description: 'Background tasks: schedules, runs and run logs. Read only in UI-M1.'
  x-milestone: UI-M1
- name: Audit
  description: 'Append-only audit events: query with filters and NDJSON export.'
  x-milestone: UI-M1
- name: System
  description: Status checks, public info and a node local metrics summary.
  x-milestone: UI-M1
- name: Dashboard
  description: Role aware landing page data in one call.
  x-milestone: UI-M1
- name: Settings
  description: Typed, schema validated settings sections (no generic capabilities framework).
  x-milestone: UI-M1
- name: Projects
  description: Optional access and policy container over repositories of any format, with members, visibility and quota.
  x-milestone: UI-M2
- name: Project members
  description: Users and identity provider groups with a project role.
  x-milestone: UI-M2
- name: Robot tokens
  description: 'Scoped API tokens for automation, optionally bound to a project: secret shown once, rotation, disable.'
  x-milestone: UI-M2
- name: Labels
  description: System and project labels on components. The word tag is reserved for OCI tags.
  x-milestone: UI-M2
- name: Retention
  description: Retention policies with rule templates, dry run and run now (Harbor style retain semantics).
  x-milestone: UI-M2
- name: Immutability
  description: Rules that protect tags or paths from overwrite, delete and re-tag.
  x-milestone: UI-M2
- name: Quotas
  description: Hard storage quotas per project and repository, with the global default.
  x-milestone: UI-M2
- name: Scanners
  description: Vulnerability scanner adapters (Trivy, OSV, external HTTP) with health and offline data status.
  x-milestone: UI-M2
- name: Scans
  description: 'Scan runs per component: start, scan all, stop, log.'
  x-milestone: UI-M2
- name: Vulnerabilities
  description: Findings per component, Security Hub search and overview, CSV export.
  x-milestone: UI-M2
- name: CVE allowlists
  description: System and project CVE allowlists with optional expiry.
  x-milestone: UI-M2
- name: SBOM
  description: Software bill of materials per OCI artifact, signatures and other accessories.
  x-milestone: UI-M2
- name: Webhooks
  description: Event notifications with HMAC-SHA256 signatures, delivery log and retries.
  x-milestone: UI-M2
- name: Registries
  description: Named upstream registry connections shared by proxy repositories, replication rules and scanners.
  x-milestone: UI-M2
- name: Replication
  description: Replication rules and executions between registries (OCI first).
  x-milestone: UI-M2
- name: Promotion
  description: Copy or move components between repositories (staging and promotion).
  x-milestone: UI-M2
- name: Trust policies
  description: Per project or repository policy that requires verified Cosign or Notation signatures before a pull.
  x-milestone: UI-M2
- name: Garbage collection
  description: Blob garbage collection with dry run, history and cooperative stop. The schedule is a system task.
  x-milestone: UI-M2
- name: Certificates
  description: Trusted CA certificates for outbound connections (upstreams, LDAP, registries).
  x-milestone: UI-M2
- name: Nodes
  description: Node list and per node details. UI-M2.
  x-milestone: UI-M2
- name: OCI artifacts
  description: 'OCI image and artifact detail: config, index children, tags.'
  x-milestone: UI-M2
