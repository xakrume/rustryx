paths:
  /api/v1/auth/providers:
    get:
      operationId: getLoginProviders
      tags: [Auth]
      summary: List sign-in options
      description: 'Public. Drives the login page: whether the local form, LDAP and the SSO button are offered and whether
        SSO is reachable.'
      x-milestone: UI-M1
      x-required-privilege: anonymous
      security: []
      responses:
        '200':
          description: Sign-in options.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginProviders'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/providers/details:
    get:
      operationId: getAuthProvidersDetails
      tags: [Auth]
      summary: Authentication configuration (read only)
      description: Authentication configuration (read only). Needs `nx-admin`.
      x-milestone: UI-M1
      x-required-privilege: nx-admin
      x-future-privilege: app.settings.read
      security:
      - {sessionCookie: []}
      - {apiToken: []}
      - {keycloakToken: []}
      responses:
        '200':
          description: Redacted authentication configuration.
          headers:
            ETag: {$ref: '#/components/headers/ETagHeader'}
            X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthProvidersDetails'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in with username and password
      description: |-
        Local accounts and LDAP. Sets the session and CSRF cookies. The `Origin` header must be the service origin (login CSRF defence); no CSRF token is needed because there is no session yet.

        Failures never say whether the account exists: wrong password, unknown user and disabled account are all `invalid_credentials`. After five failures the account and the address are locked out (`locked_out`, `Retry-After`, growing delay). While the login counter store is down, password logins fail closed with `login_unavailable`.

        Audit: `login_success` on success, `login_failure` (action `auth.login`, outcome `failure`) on every refusal.
      x-milestone: UI-M1
      x-required-privilege: anonymous
      x-audit:
        kind: login_success
        action: auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      security: []
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookieHeader'}
            X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/oidc/login:
    get:
      operationId: startOidcLogin
      tags: [Auth]
      summary: Start the OIDC login (redirect)
      description: |-
        Top level browser navigation, not an XHR. Creates the sealed state cookie (AES-256-GCM, HttpOnly, Secure, SameSite=Lax, Path = callback path) and answers 302 to the Keycloak authorization endpoint (authorization code with PKCE S256, confidential client `rustryx-ui`). While Keycloak is unreachable the answer is 503 and nothing else is affected.

        404 `not_found` when OIDC is not enabled.
      x-milestone: UI-M1
      x-required-privilege: anonymous
      parameters:
      - name: return_to
        in: query
        description: Same-origin path to open after login. Anything that is not a plain absolute path is replaced by `/`.
        schema:
          type: string
          maxLength: 512
          pattern: ^/[^/\\].*$|^/$
          default: /
        example: /repositories
      security: []
      responses:
        '302':
          description: Redirect to Keycloak.
          headers:
            Location: {$ref: '#/components/headers/LocationHeader'}
            Set-Cookie: {$ref: '#/components/headers/SetCookieHeader'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/oidc/callback:
    get:
      operationId: completeOidcLogin
      tags: [Auth]
      summary: OIDC callback (redirect)
      description: |-
        Registered as the redirect URI of `rustryx-ui` in Keycloak (`<base_url>/api/v1/auth/oidc/callback`). Any node can serve it. Validates the cookie, `state` and the ID token (nonce, issuer, audience), resolves groups, provisions the account (JIT) and issues the cookie session, then answers 302 to the stored `return_to`.

        A browser expects a page, not JSON: when `Accept` prefers `text/html` every failure is a 302 to `/login?error=<code>&request_id=<id>`; other callers get the usual envelope with the same code. Mapping: bad cookie, state or ID token is 400 `oidc_callback_invalid`; Keycloak refused the code 401 `invalid_credentials`; Keycloak unreachable 503 `identity_provider_unavailable`; username used by another source 409 `username_conflict`; no mapped role and no default role 403 `forbidden`.
      x-milestone: UI-M1
      x-required-privilege: anonymous
      x-audit:
        kind: login_success
        action: auth.oidc_login
      parameters:
      - name: code
        in: query
        description: Authorization code.
        schema:
          type: string
          maxLength: 2048
      - name: state
        in: query
        description: State echoed by Keycloak.
        schema:
          type: string
          maxLength: 512
      - name: error
        in: query
        description: Error code when Keycloak refused the login.
        schema:
          type: string
          maxLength: 128
      - name: error_description
        in: query
        description: Error text from Keycloak (not shown to users).
        schema:
          type: string
          maxLength: 1024
      security: []
      responses:
        '302':
          description: Signed in, redirect to `return_to`.
          headers:
            Location: {$ref: '#/components/headers/LocationHeader'}
            Set-Cookie: {$ref: '#/components/headers/SetCookieHeader'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Sign out
      description: |-
        Idempotent: without a session it only clears cookies. Revokes the session id (`tid`) so the cookie is useless even if copied, and clears both cookies. When RP-initiated logout is configured the result carries the Keycloak URL to open next.

        Audit: action `auth.logout` (a dedicated kind is proposed, see docs/api-conventions.md).
      x-milestone: UI-M1
      x-required-privilege: anonymous
      x-audit:
        kind: login_success
        action: auth.logout
      security:
      - {}
      - {sessionCookie: [], csrfToken: []}
      - {apiToken: []}
      - {keycloakToken: []}
      responses:
        '200':
          description: Signed out.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookieHeader'}
            X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogoutResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [Auth]
      summary: Current session
      description: 'Bootstraps the SPA: tells whether a session exists, when it ends, and returns the CSRF token. Does not
        extend the session.'
      x-milestone: UI-M1
      x-required-privilege: anonymous
      security:
      - {}
      - {sessionCookie: []}
      - {apiToken: []}
      - {keycloakToken: []}
      responses:
        '200':
          description: Session state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/session/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Refresh the session
      description: Resets the idle timer and reissues the internal JWT (and, for SSO users, refreshes the Keycloak group
        snapshot, which may be at most 5 minutes old). The server also does this transparently on normal activity when less
        than half of the idle time is left; this call exists for a keep-alive timer. It never moves `absolute_expires_at`.
        A failed group refresh ends the session (401 `token_expired`).
      x-milestone: UI-M1
      x-required-privilege: interactive
      security:
      - {sessionCookie: [], csrfToken: []}
      - {keycloakToken: []}
      responses:
        '200':
          description: Session refreshed (new cookies).
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookieHeader'}
            X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Auth]
      summary: Get the CSRF token
      description: Returns the CSRF token of the current session; the same value until the session is reissued. Use it to
        recover after a 403 `csrf_rejected`.
      x-milestone: UI-M1
      x-required-privilege: interactive
      security:
      - {sessionCookie: []}
      - {keycloakToken: []}
      responses:
        '200':
          description: CSRF token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfToken'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/me:
    get:
      operationId: getMe
      tags: [Me]
      summary: The calling principal
      description: Identity, effective roles with origin, external groups of this request and a permission summary. Works
        anonymously.
      x-milestone: UI-M1
      x-required-privilege: anonymous
      security:
      - {}
      - {sessionCookie: []}
      - {apiToken: []}
      - {keycloakToken: []}
      responses:
        '200':
          description: The principal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/me/password:
    put:
      operationId: changeMyPassword
      tags: [Me]
      summary: Change the own password
      description: Local accounts only (`external_identity` for LDAP and OIDC accounts). Counts a wrong current password
        like a failed login. On success every other session of the user is revoked (`tokens_valid_after` moves) and the
        current cookie is reissued.
      x-milestone: UI-M1
      x-required-privilege: interactive
      x-audit:
        kind: rbac_change
        action: user.password_change
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      security:
      - {sessionCookie: [], csrfToken: []}
      - {keycloakToken: []}
      responses:
        '204':
          description: Password changed; the session cookie is reissued.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookieHeader'}
            X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/me/actions/sign-out-everywhere:
    post:
      operationId: signOutEverywhere
      tags: [Me]
      summary: Sign out of every session
      description: 'Moves `tokens_valid_after` of the user to now: every internal JWT issued before is rejected on every
        node. API tokens are not affected (revoke them separately).'
      x-milestone: UI-M1
      x-required-privilege: interactive
      x-audit:
        kind: token_change
        action: session.revoke_all
      security:
      - {sessionCookie: [], csrfToken: []}
      - {keycloakToken: []}
      responses:
        '204':
          description: All sessions ended; cookies cleared.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookieHeader'}
            X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/me/tokens:
    get:
      operationId: listMyTokens
      tags: [Me]
      summary: List own API tokens
      description: Tokens of the caller, newest first. Secrets are never returned.
      x-milestone: UI-M1
      x-required-privilege: interactive
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/After'}
      - name: state
        in: query
        description: Filter by state.
        schema:
          type: string
          enum: [active, expired, revoked, disabled]
      security:
      - {sessionCookie: []}
      - {keycloakToken: []}
      responses:
        '200':
          description: A page of tokens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiTokenViewPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
