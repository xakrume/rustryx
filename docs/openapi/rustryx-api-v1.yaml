  headers:
    RequestIdHeader:
      description: Request id. Taken from the request when well formed, generated otherwise. Quote it in bug reports.
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9._-]+$
    RetryAfterHeader:
      description: Whole seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
        format: int64
    ETagHeader:
      description: Opaque version of the returned object. Send it back in `If-Match` when changing the object.
      schema:
        type: string
        example: '"c0ffee"'
    LocationHeader:
      description: URL of the created or started resource.
      schema:
        type: string
        format: uri-reference
    SetCookieHeader:
      description: Session cookie `__Host-rustryx_session` (HttpOnly, Secure, SameSite=Lax, Path=/) and CSRF cookie `__Host-rustryx_csrf`
        (Secure, SameSite=Strict, Path=/, readable by script).
      schema:
        type: string
    ContentDispositionHeader:
      description: '`attachment; filename=...` for downloads and exports.'
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed input (`invalid_input`, `invalid_json`, `invalid_query`, `invalid_path`, `invalid_page_token`
        and the other 400 codes).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            invalid_input:
              summary: invalid_input
              value:
                error:
                  code: invalid_input
                  message: Repository name must start with a letter or digit
                  request_id: 0192f6c4-5a1e-7000-8000-00000000c0de
                  details:
                    fields:
                    - field: /name
                      code: invalid_name
                      message: Repository name must start with a letter or digit
            invalid_page_token:
