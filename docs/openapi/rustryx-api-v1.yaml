    get:
      operationId: listRepositories
      tags: [Repositories]
      summary: List repositories
      description: 'Repositories the caller may browse; the others are omitted (their existence is not revealed). Anonymous
        callers see public repositories when both anonymous switches are on. The bounded set is paged by name; a page may
        hold fewer items than `limit` after permission filtering, only `next: null` ends the list.'
      x-milestone: UI-M1
      x-required-privilege: repo.browse(R) per item
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/After'}
      - name: include
        in: query
        description: Extra data to compute. `stats` fills `stats` (one extra query per page).
        schema:
          type: array
          items:
            type: string
            enum: [stats]
          uniqueItems: true
        style: form
        explode: false
      - name: format
        in: query
        description: Format.
        schema: {$ref: '#/components/schemas/RepoFormat'}
      - name: repo_type
        in: query
        description: Type.
        schema: {$ref: '#/components/schemas/RepoType'}
      - name: online
        in: query
        description: Online status.
        schema:
          type: boolean
      - name: blob_store
        in: query
        description: Blob store name.
        schema:
          type: string
      - name: allow_anonymous
        in: query
        description: Repository flag.
        schema:
          type: boolean
      - name: q
        in: query
        description: Name contains (case-insensitive).
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: sort
        in: query
        description: Sort order. A leading `-` means descending. The page token is bound to the sort order.
        schema:
          type: string
          enum: [name, -name, created_at, -created_at]
          default: name
      security:
      - {}
      - {sessionCookie: []}
      - {apiToken: []}
      - {keycloakToken: []}
      responses:
        '200':
          description: A page of repositories.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryViewPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: createRepository
      tags: [Repositories]
      summary: Create a repository
      description: |-
        Needs `nx-admin` in phase 1 (`repo.admin(*)` once per repository administration exists). 409 `already_exists` for a taken name; the UI checks live with `GET /repositories?q=`.

        400 `upstream_url_rejected` (SSRF filter), `invalid_input` with `details.fields` (member of another format, unknown blob store, a `proxy` on a hosted repository). 404 is not used: unknown referenced objects are field errors.
      x-milestone: UI-M1
      x-required-privilege: nx-admin
      x-future-privilege: repo.admin(*)
      x-audit:
        kind: config_change
        action: repository.create
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepositoryCreate'}
            examples:
              hosted:
                summary: Hosted Maven releases
                value:
                  name: maven-releases
                  format: maven2
                  repo_type: hosted
                  blob_store_id: 0192f6c4-5a1e-7000-8000-000000000029
                  write_policy: allow_once
                  cleanup_policy_ids: [0192f6c4-5a1e-7000-8000-00000000006f]
                  format_config:
                    version_policy: release
                    layout_policy: strict
              proxy:
                summary: npm proxy
                value:
                  name: npm-proxy
                  format: npm
                  repo_type: proxy
                  blob_store_id: 0192f6c4-5a1e-7000-8000-000000000029
                  routing_rule_id: 0192f6c4-5a1e-7000-8000-000000000079
                  proxy:
                    remote_url: https://registry.npmjs.org
                    auth: null
                    content_max_age_secs: 86400
                    metadata_max_age_secs: 1800
                    negative_cache_ttl_secs: 3600
                    max_concurrent_upstream: 16
              group:
                summary: Maven group
                value:
                  name: maven-public
                  format: maven2
                  repo_type: group
                  blob_store_id: 0192f6c4-5a1e-7000-8000-000000000029
                  allow_anonymous: true
                  group:
                    members: [maven-releases, maven-central]
      security:
      - {sessionCookie: [], csrfToken: []}
      - {apiToken: []}
      - {keycloakToken: []}
      responses:
        '201':
          description: Repository created.
          headers:
            Location: {$ref: '#/components/headers/LocationHeader'}
            ETag: {$ref: '#/components/headers/ETagHeader'}
            X-Request-Id: {$ref: '#/components/headers/RequestIdHeader'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
