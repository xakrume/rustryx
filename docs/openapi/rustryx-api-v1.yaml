      type: object
      description: Expression to compile.
      properties:
        expression:
          type: string
          minLength: 0
          maxLength: 4096
          description: The text to compile. Longer than 1024 bytes is reported as a `too_long` issue, not rejected.
      required: [expression]
      additionalProperties: false
      example:
        expression: path.startsWith("/com/example/")
    SelectorValidateResult:
      type: object
      description: 'Compile result. Always 200: a syntax error is a result, not a failure of the call.'
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items: {$ref: '#/components/schemas/SelectorCompileIssue'}
      required: [valid, errors]
      example:
        valid: true
        errors: []
    SelectorSample:
      type: object
      description: One sample resource to evaluate an expression against.
      properties:
        format: {$ref: '#/components/schemas/RepoFormat'}
        path:
          type: string
          maxLength: 8192
          description: Normalized path with a leading `/`.
        repository:
          type: string
          maxLength: 128
          default: ''
        coordinate:
          type: object
          description: Component coordinate when the format can derive one. Absent or null parts are *unknown*.
          properties:
            group:
              type: [string, 'null']
            name:
              type: [string, 'null']
            version:
              type: [string, 'null']
      required: [format, path]
      additionalProperties: false
      example:
        format: maven2
        path: /com/example/lib/1.0/lib-1.0.jar
        repository: maven-releases
        coordinate:
          group: com.example
          name: lib
          version: '1.0'
    SelectorTestRequest:
      type: object
      description: Expression and samples to evaluate. Evaluation is bounded (node budget, input caps), so this is safe
        to expose.
      properties:
        expression:
          type: string
          minLength: 1
          maxLength: 4096
        samples:
          type: array
          items: {$ref: '#/components/schemas/SelectorSample'}
          minItems: 1
          maxItems: 50
      required: [expression, samples]
      additionalProperties: false
      example:
        expression: path.startsWith("/com/example/")
        samples:
        - format: maven2
          path: /com/example/lib/1.0/lib-1.0.jar
          repository: maven-releases
          coordinate:
            group: com.example
            name: lib
            version: '1.0'
    SelectorTestResult:
      type: object
      description: Per sample verdicts.
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items: {$ref: '#/components/schemas/SelectorCompileIssue'}
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
                format: int64
              result:
                type: string
                enum: [match, no_match, unknown]
                description: '`unknown` means the outcome depends on data the sample lacks. Unknown never grants access.'
              reason:
                type: [string, 'null']
                description: 'For `unknown` and evaluation limits: which input was missing or which limit was hit.'
            required: [index, result, reason]
          description: One entry per sample, in order. Empty when the expression does not compile.
      required: [valid, errors, results]
      example:
        valid: true
        errors: []
        results:
        - index: 0
          result: match
          reason: null
    SelectorPreviewRequest:
      type: object
      description: Evaluate an expression against stored assets of one repository (at most 10 hits, evaluation cost bounded).
      properties:
        expression:
          type: string
          minLength: 1
          maxLength: 4096
        repository: {$ref: '#/components/schemas/RepoName'}
        limit:
          type: integer
          minimum: 1
          maximum: 10
          default: 10
          format: int32
      required: [expression, repository]
      additionalProperties: false
      example:
        expression: path.startsWith("/com/example/")
        repository: maven-releases
        limit: 10
    SelectorPreviewResult:
      type: object
      description: Preview hits.
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items: {$ref: '#/components/schemas/SelectorCompileIssue'}
        items:
          type: array
          items:
            type: object
            properties:
              asset_id:
                type: string
                format: uuid
              path:
                type: string
              component_id:
                type: [string, 'null']
                format: uuid
            required: [asset_id, path, component_id]
        truncated:
          type: boolean
          description: True when more than `limit` assets match or the scan budget ran out.
      required: [valid, errors, items, truncated]
      example:
        valid: true
        errors: []
        items:
        - asset_id: 0192f6c4-5a1e-7000-8000-00000000005b
          path: com/example/lib/1.0/lib-1.0.jar
          component_id: 0192f6c4-5a1e-7000-8000-00000000005f
        truncated: false
    SelectorLanguage:
      type: object
