        in: query
        description: Action label or prefix ending with `.`, for example `role.`.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: target
        in: query
        description: Exact target.
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: repository
        in: query
        description: Events whose target is this repository or a path or component inside it.
        schema: {$ref: '#/components/schemas/RepoName'}
      - name: outcome
        in: query
        description: Outcome.
        schema:
          type: string
          enum: [success, failure]
      - name: request_id
        in: query
        description: Exact request id.
        schema:
          type: string
          maxLength: 64
      - name: from
        in: query
        description: Event time at or after (inclusive).
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Event time before (exclusive).
        schema:
          type: string
          format: date-time
      - name: project
        in: query
