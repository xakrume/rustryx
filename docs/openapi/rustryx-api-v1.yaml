            minimum: 0
            format: int64
          credentials:
            oneOf:
            - {$ref: '#/components/schemas/BlobStoreCredentialsState'}
            - type: 'null'
        required: [usage, health, repository_count, credentials]
      example:
        id: 0192f6c4-5a1e-7000-8000-000000000029
        name: default
        kind: local
        config:
