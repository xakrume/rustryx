            - {$ref: '#/components/schemas/UpstreamStatus'}
            - type: 'null'
          anonymous_effective:
            type: boolean
            description: '`allow_anonymous` and the global switch are both on.'
        required: [blob_store, url, cleanup_policies, routing_rule, stats, permissions, upstream, anonymous_effective]
      example:
        id: 0192f6c4-5a1e-7000-8000-00000000001f
        name: maven-releases
        format: maven2
        repo_type: hosted
        blob_store_id: 0192f6c4-5a1e-7000-8000-000000000029
        write_policy: allow_once
