[package]
name = "rustryx-testserver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Rustryx: in-process HTTP harness that mounts the format engine for real package clients"

[lints]
workspace = true

[dependencies]
rustryx-core.workspace = true
rustryx-format-core.workspace = true
rustryx-rbac.workspace = true
# The harness is built on the in-memory ports; it is a dev-dependency of the format crates and
# is never linked into a binary.
rustryx-testkit.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
rand.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
# `process` runs the real package clients; it is additive, like `test-util` in the testkit.
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
wiremock.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
