suite: secrets and service accounts
templates:
  - templates/serviceaccount.yaml
  - templates/externalsecret.yaml
  - templates/deployment.yaml
values:
  - ../ci/base-values.yaml
tests:
  - it: creates a ServiceAccount that does not mount the API token
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: must_not_create_a_Role_or_RoleBinding
    # The chart ships no RBAC at all: the app never calls the Kubernetes API (OPS-36).
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: renders no ExternalSecret by default
    template: templates/externalsecret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an ExternalSecret that fills the Secret the Deployment consumes
    template: templates/externalsecret.yaml
    values:
      - ../ci/full-values.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: rustryx
      - equal:
          path: spec.target.creationPolicy
          value: Orphan
      - equal:
          path: spec.secretStoreRef.name
          value: platform-vault
      - equal:
          path: spec.data[0].secretKey
          value: RUSTRYX_DATABASE_URL

  - it: applies the ExternalSecret as an early hook only when asked (first install needs the Secret before the migration Job)
    template: templates/externalsecret.yaml
    values:
      - ../ci/full-values.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"

  - it: keeps the ExternalSecret a regular resource without hook
    template: templates/externalsecret.yaml
    values:
      - ../ci/full-values.yaml
    set:
      externalSecret.hook: false
      externalSecret.creationPolicy: Owner
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: must_not_hold_secret_values_in_the_ExternalSecret
    template: templates/externalsecret.yaml
    values:
      - ../ci/full-values.yaml
    asserts:
      - notExists:
          path: spec.data[?(@.value)]
      - notExists:
          path: spec.data[?(@.remoteRef.value)]

  - it: gives the secret store its own ServiceAccount without a token mount
    template: templates/serviceaccount.yaml
    values:
      - ../ci/full-values.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-rustryx-eso
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: must_not_hold_a_vault_client_or_approle_in_the_pod
    template: templates/deployment.yaml
    values:
      - ../ci/full-values.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name =~ /VAULT_.*|.*ROLE_ID|.*SECRET_ID/)]
      - notExists:
          path: spec.template.spec.initContainers
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
