{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "rustryx.fullname" . }}
  labels:
    {{- include "rustryx.labels" . | nindent 4 }}
  {{- if .Values.externalSecret.hook }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    # The Deployment and the migration Job consume exactly this Secret name.
    name: {{ include "rustryx.secretName" . }}
    creationPolicy: {{ .Values.externalSecret.creationPolicy }}
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
