{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rustryx.serviceAccountName" . }}
  labels:
    {{- include "rustryx.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never calls the Kubernetes API (OPS-36). Cloud workload identity for S3
# (IRSA and similar) is injected by its own webhook as a separate projected volume, so it does
# not depend on the default API token being mounted.
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.externalSecret.enabled .Values.externalSecret.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-eso" (include "rustryx.fullname" .)) .Values.externalSecret.serviceAccount.name }}
  labels:
    {{- include "rustryx.labels" . | nindent 4 }}
  {{- with .Values.externalSecret.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Separate from the workload account on purpose: the SecretStore authenticates as this one, so a
# compromised Rustryx pod does not inherit the right to read the secret store (OPS-36).
automountServiceAccountToken: false
{{- end }}
