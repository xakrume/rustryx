name: nightly

# Scheduled checks that do not depend on a commit: the advisory database changes
# every day, and fuzzing needs far more time than a pull request run may take.
# Nothing here gates a merge, so a red run is the alert itself and these jobs have
# no `continue-on-error`.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Fixed nightly: cargo-fuzz needs sanitizer flags only a nightly compiler has.
  # Moving it forward is a one-line change, and a fixed date keeps two nights
  # comparable. The date must be a day on which a nightly was published.
  FUZZ_TOOLCHAIN: nightly-2026-10-01
  FUZZ_SECONDS: "600"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
          fallback: none
      - name: Exceptions have not expired
        run: python3 ci/check-exceptions.py
      - name: cargo audit, fail on high and above, list every warning
        run: |
          set +e
          cargo audit --json >audit.json 2>audit.err
          python3 ci/audit-gate.py --fail-on high --summary "$GITHUB_STEP_SUMMARY" audit.json
          exit $?
      - name: cargo deny advisories
        run: cargo deny check advisories
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-audit
          path: audit.json
          retention-days: 30

  # Lists fuzz/fuzz_targets/*.rs. Targets arrive with the crates that own the
  # parsers, so the matrix follows the directory instead of a hand-kept list; with
  # no targets the fuzz job is skipped rather than run empty.
  fuzz-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          targets='[]'
          if [ -d fuzz/fuzz_targets ]; then
            targets=$(find fuzz/fuzz_targets -maxdepth 1 -name '*.rs' -exec basename {} .rs \; | sort | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          fi
          echo "targets=$targets" >>"$GITHUB_OUTPUT"
          echo "fuzz targets: $targets"

  fuzz:
    needs: fuzz-targets
    if: needs.fuzz-targets.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo +"$FUZZ_TOOLCHAIN" install --locked --version 0.13.2 cargo-fuzz
      # The corpus grows from night to night; losing it would make every run start
      # from the seeds again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }} for ten minutes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +"$FUZZ_TOOLCHAIN" fuzz run "$TARGET" -- \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -timeout=30
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 90
